<div class="container">

<h2>Online Store</h2>

<div class="form-box">

<h3>Add Product</h3>

<input
type="text"
placeholder="Product name"
[(ngModel)]="newProduct.name">

<input
type="number"
placeholder="Price"
[(ngModel)]="newProduct.price">

<input
type="text"
placeholder="Category"
[(ngModel)]="newProduct.category">

<button (click)="addProduct()">Add Product</button>

</div>


<div class="form-box" *ngIf="editingProduct">

<h3>Edit Product</h3>

<input
type="text"
[(ngModel)]="editingProduct.name">

<input
type="number"
[(ngModel)]="editingProduct.price">

<input
type="text"
[(ngModel)]="editingProduct.category">

<button (click)="updateProduct()">Update</button>

</div>


<table>

<thead>

<tr>
<th>Name</th>
<th>Price</th>
<th>Category</th>
<th>Actions</th>
</tr>

</thead>

<tbody>

<tr *ngFor="let p of products">

<td>{{p.name}}</td>
<td>{{p.price}}</td>
<td>{{p.category}}</td>

<td>
<button class="edit" (click)="editProduct(p)">Edit</button>
<button class="delete" (click)="deleteProduct(p.id)">Delete</button>
</td>

</tr>

</tbody>

</table>

</div>
