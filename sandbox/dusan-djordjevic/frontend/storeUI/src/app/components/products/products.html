<div class="container">

<h2>Products</h2>

<div class="form-box">

<input
[(ngModel)]="newProduct.name"
placeholder="Product name"
/>

<input
type="number"
[(ngModel)]="newProduct.price"
placeholder="Price"
/>

<input
[(ngModel)]="newProduct.category"
placeholder="Category"
/>

<button (click)="addProduct()">
Add Product
</button>

</div>

<table>

<tr>
<th>Name</th>
<th>Price</th>
<th>Category</th>
<th>Actions</th>
</tr>

<tr *ngFor="let product of products">

<td>{{product.name}}</td>
<td>{{product.price}}</td>
<td>{{product.category}}</td>

<td>
<button class="edit" (click)="editProduct(product)">Edit</button>
<button class="delete" (click)="deleteProduct(product.id)">Delete</button>
</td>

</tr>

</table>

<div *ngIf="editingProduct" class="form-box">

<h2>Edit Product</h2>

<input [(ngModel)]="editingProduct.name">

<input type="number" [(ngModel)]="editingProduct.price">

<input [(ngModel)]="editingProduct.category">

<button (click)="updateProduct()">Save</button>
<button (click)="editingProduct = null">Cancel</button>

</div>

</div>
