<div style="padding: 20px; font-family: sans-serif;">
  <h2>Lista studenata</h2>
  <p>Broj studenata: {{ studenti().length }}</p>

  <button (click)="noviStudent()" style="margin-bottom: 10px; cursor: pointer;">+ Dodaj studenta</button>

  <table border="1" style="width: 100%; border-collapse: collapse;">
    <thead style="background-color: #f2f2f2;">
      <tr>
        <th>ID</th>
        <th>Ime</th>
        <th>Prezime</th>
        <th>Indeks</th>
        <th>Upisan</th>
        <th>Akcije</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of studenti()">
        <td>{{ s.id }}</td>
        <td>{{ s.ime }}</td>
        <td>{{ s.prezime }}</td>
        <td>{{ s.indeks }}</td>
        <td>{{ s.upisan }}</td>
        <td>
          <button (click)="obrisiStudenta(s.id)" style="color: red; cursor: pointer; margin-right: 5px;">Obriši</button>
          <button (click)="izmeniStudenta(s.id)" style="color: blue; cursor: pointer;">Izmeni</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
