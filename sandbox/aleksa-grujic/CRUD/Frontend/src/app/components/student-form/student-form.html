<div style="padding: 20px; font-family: sans-serif;">
  <h2>{{ editMode() ? 'Izmeni studenta' : 'Dodaj studenta' }}</h2>

  <input [value]="forma().ime" (input)="updateForma('ime', $event.target.value)" placeholder="Ime" style="margin-right: 5px;" />
  <input [value]="forma().prezime" (input)="updateForma('prezime', $event.target.value)" placeholder="Prezime" style="margin-right: 5px;" />
  <input [value]="forma().indeks" (input)="updateForma('indeks', +$event.target.value)" placeholder="Indeks" type="number" style="margin-right: 5px;" />
  <input [value]="forma().upisan" (input)="updateForma('upisan', +$event.target.value)" placeholder="Upisan" type="number" style="margin-right: 5px;" />
  <button (click)="sacuvaj()" style="color: green; cursor: pointer;">Sačuvaj</button>
  <button (click)="otkazi()" style="margin-left: 5px; cursor: pointer;">Otkaži</button>
</div>
