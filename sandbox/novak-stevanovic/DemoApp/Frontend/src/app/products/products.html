<h2>Products</h2>

<form>
  <div>
    <input
      type="text"
      name="name"
      [(ngModel)]="form.name"
      placeholder="Name"
      required
    />
  </div>

  <div>
    <input
      type="number"
      name="price"
      [(ngModel)]="form.price"
      placeholder="Price"
      required
    />
  </div>

  <div>
    <input
      type="text"
      name="description"
      [(ngModel)]="form.description"
      placeholder="Description"
    />
  </div>

  <br />

  <button type="button" (click)="save()">
    {{ editMode ? 'Update' : 'Add' }}
  </button>

  <button type="button" (click)="resetForm()">
    Cancel
  </button>
</form>

<hr />
