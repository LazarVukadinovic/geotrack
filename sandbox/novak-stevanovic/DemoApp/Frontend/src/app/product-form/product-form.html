<h2>{{ editMode ? 'Edit product' : 'Add product' }}</h2>

<form (ngSubmit)="save()">
  <div>
    <input
      type="text"
      name="name"
      [(ngModel)]="form.name"
      placeholder="Name"
      required
    />
  </div>

  <div>
    <input
      type="number"
      name="price"
      [(ngModel)]="form.price"
      placeholder="Price"
      required
    />
  </div>

  <div>
    <input
      type="text"
      name="description"
      [(ngModel)]="form.description"
      placeholder="Description"
    />
  </div>

  <br />

  <button type="submit">
    {{ editMode ? 'Update' : 'Create' }}
  </button>

  <a routerLink="/products">Cancel</a>
</form>
