<form #form="ngForm" (submit)="onSubmit(form)" [class.submitted] = "paymentDetailService.formSubmitted" novalidate autocomplete="off">
    <input type="hidden" name="paymentDetailId" [value]="paymentDetailService.formData.paymentDetailId">
    <div class="mb-3">
        <label>Card Owner Name</label>
        <input class="form-control form-control-lg" placeholder="Name on card" #cardOwnerName="ngModel" name="cardOwnerName" [(ngModel)]="paymentDetailService.formData.cardOwnerName" required>
    </div>
    <div class="mb-3">
        <label>Card Number</label>
        <input class="form-control form-control-lg" placeholder="16 digit card number" #cardNumber="ngModel" name="cardNumber" [(ngModel)]="paymentDetailService.formData.cardNumber" minlength="16" maxlength="16" required>
    </div>
    <div class="row">
        <div class="mb-3 col-6">
            <label>Expiration Date</label>
            <input class="form-control form-control-lg" placeholder="MM/YY" #expirationDate="ngModel" name="expirationDate" [(ngModel)]="paymentDetailService.formData.expirationDate" minlength="5" maxlength="5" required>
        </div>
        <div class="mb-3 col-6">
            <label>Security Code</label>
            <input type="password" class="form-control form-control-lg" placeholder="3 digit code" #securityCode="ngModel" name="securityCode" [(ngModel)]="paymentDetailService.formData.securityCode" minlength="3" maxlength="3" required>
        </div>
    </div>
    <div class="d-grid">
        <button class="btn btn-lg btn-success" type="submit">Submit</button>
    </div>
</form>
