<!-- src/app/auth/login/login.component.html -->
<div class="flex h-screen w-screen overflow-hidden font-sans">

  <!-- ═══ LEFT PANEL ═══ -->
  <div
    class="relative flex flex-col justify-between overflow-hidden min-w-[320px] w-[380px] px-10 py-12"
    style="background: linear-gradient(145deg, #1a2a6c 0%, #1565d8 55%, #0f9adb 100%);"
  >
    <!-- Grid overlay -->
    <div
      class="absolute inset-0 pointer-events-none"
      style="
        background-image:
          linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 32px 32px;
      "
    ></div>

    <!-- Glow orb 1 -->
    <div
      class="absolute rounded-full pointer-events-none animate-[float_8s_ease-in-out_infinite]"
      style="width:220px; height:220px; background:rgba(15,200,220,0.25); filter:blur(60px); top:-60px; right:-60px;"
    ></div>
    <!-- Glow orb 2 -->
    <div
      class="absolute rounded-full pointer-events-none animate-[float_8s_ease-in-out_4s_infinite]"
      style="width:180px; height:180px; background:rgba(100,80,255,0.2); filter:blur(60px); bottom:60px; left:-40px;"
    ></div>

    <!-- Brand -->
    <div class="relative z-10 flex items-center gap-3">
      <img
        src="assets/logo.png"
        alt="GeoTrack logo"
        class="w-9 h-9 object-contain rounded-lg"
        style="filter: drop-shadow(0 0 8px rgba(0,220,255,0.5));"
      />
      <span class="text-white font-bold text-xl tracking-wide">GeoTrack</span>
    </div>

    <!-- Welcome text -->
    <div class="relative z-10">
      <h1 class="text-white font-extrabold leading-tight mb-4 text-[2.1rem]">
        Welcome to<br />
        <span class="text-[#7de8ff]">GeoTrack</span>
      </h1>
      <p class="text-blue-100 text-sm leading-relaxed max-w-[260px] opacity-85">
        Access the platform to manage destinations, locations, places, events, and content workflows.
      </p>
    </div>

    <!-- Pagination dots -->
    <div class="relative z-10 flex items-center gap-2">
      <span class="rounded-full bg-white" style="width:36px; height:6px;"></span>
      <span class="rounded-full bg-white/30" style="width:24px; height:6px;"></span>
      <span class="rounded-full bg-white/30" style="width:24px; height:6px;"></span>
    </div>
  </div>

  <!-- ═══ RIGHT PANEL ═══ -->
  <div class="flex-1 flex flex-col items-center justify-center relative bg-[#f4f6fb]">

    <!-- Form card -->
    <div
      class="bg-white rounded-2xl w-full border border-[#e8ecf4] px-10 py-10"
      style="max-width:420px; box-shadow: 0 4px 24px rgba(0,0,0,0.07);"
    >
      <!-- Header -->
      <div class="text-center mb-8">
        <h2 class="font-bold text-gray-900 text-2xl mb-1.5">Sign in</h2>
        <p class="text-gray-500 text-sm">Use your account to access GeoTrack</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>

        <!-- Email field -->
        <div class="mb-5">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            [ngModel]="email()" (ngModelChange)="email.set($event)"
            placeholder="name@example.com"
            required
            autocomplete="email"
            class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-900 placeholder-[#aab4c4] transition-all outline-none focus:bg-white focus:border-[#1565d8]"
            style="box-shadow:none;"
            (focus)="$event.target.style.boxShadow='0 0 0 3px rgba(21,101,216,0.12)'"
            (blur)="$event.target.style.boxShadow='none'"
          />
        </div>

        <!-- Password field -->
        <div class="mb-5">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <div class="relative">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              name="password"
              [ngModel]="password()" (ngModelChange)="password.set($event)"
              placeholder="••••••••"
              required
              autocomplete="current-password"
              class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 pr-10 text-sm text-gray-900 placeholder-[#aab4c4] transition-all outline-none focus:bg-white focus:border-[#1565d8]"
              (focus)="$event.target.style.boxShadow='0 0 0 3px rgba(21,101,216,0.12)'"
              (blur)="$event.target.style.boxShadow='none'"
            />
            <button
              type="button"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors bg-transparent border-0 p-0 cursor-pointer flex items-center"
            >
              <svg *ngIf="!showPassword()" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword()" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember me + Forgot -->
        <div class="flex items-center justify-between mb-6 text-sm">
          <label class="flex items-center gap-2 text-gray-600 cursor-pointer select-none">
            <input
              type="checkbox"
              name="rememberMe"
              [ngModel]="rememberMe()" (ngModelChange)="rememberMe.set($event)"
              class="rounded border-gray-300 w-[15px] h-[15px] cursor-pointer"
              style="accent-color: #1565d8;"
            />
            <span>Remember me</span>
          </label>
          <a href="#" class="text-blue-600 hover:text-blue-800 font-medium no-underline transition-colors">
            Forgot password?
          </a>
        </div>

        <!-- Sign in button -->
        <button
          type="submit"
          [disabled]="isLoading() || !email() || !password()"
          class="w-full rounded-lg text-white font-semibold text-sm py-3 border-0 cursor-pointer tracking-wide transition-all disabled:opacity-60 disabled:cursor-not-allowed hover:enabled:-translate-y-px"
          style="background: linear-gradient(135deg, #1565d8 0%, #1a86e8 100%);"
          [style.boxShadow]="isLoading() || !email() || !password() ? 'none' : ''"
          (mouseenter)="setSubmitHover($event, true)"
          (mouseleave)="setSubmitHover($event, false)"
        >
          <span *ngIf="!isLoading()">Sign In</span>
          <span *ngIf="isLoading()" class="flex items-center justify-center gap-2">
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Signing in...
          </span>
        </button>

        <p class="text-center text-gray-400 text-xs mt-5">Authorized users only</p>
      </form>
    </div>

    <!-- Footer -->
    <footer class="absolute bottom-6 flex items-center gap-2 text-gray-400 text-xs">
      <span>GeoTrack Platform</span>
      <span class="text-gray-300">·</span>
      <span>© 2026 All rights reserved.</span>
    </footer>
  </div>
</div>
