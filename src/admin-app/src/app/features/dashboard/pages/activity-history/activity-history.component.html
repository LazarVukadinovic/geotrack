<div class="flex h-screen w-screen overflow-hidden bg-gray-50 font-sans">
  <app-sidebar
    [regions]="regions"
    [activeRegionId]="activeRegionId"
    (regionChange)="onRegionSelected($event)"
  />

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <app-topbar [userName]="userName" [userRole]="userRole" title="Activity History" [showBack]="true" backRoute="/dashboard" />

    <div class="flex-1 overflow-y-auto px-8 py-6">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Activity History</h1>
        <p class="text-sm text-gray-500 mt-0.5">{{ regionDisplayName || 'Assigned region activity' }}</p>
      </div>

      <div *ngIf="errorMessage" class="bg-white rounded-xl border border-red-100 p-6 mb-6">
        <p class="text-sm text-red-600">{{ errorMessage }}</p>
      </div>

      <div class="bg-white rounded-xl border border-gray-100 divide-y divide-gray-50 history-panel">
        <div *ngIf="items.length === 0 && !loading" class="px-4 py-6 text-sm text-gray-500">
          No activity has been recorded for this region.
        </div>

        <div *ngFor="let item of items" class="px-4 py-3">
          <p class="text-sm font-medium text-gray-800">{{ item.description }}</p>
          <div class="text-xs text-gray-400 mt-1">
            <span class="capitalize">{{ item.entityType }}</span>
            <span>&middot;</span>
            <span>{{ timeAgo(item.occurredAt) }}</span>
          </div>
        </div>
      </div>

      <div class="mt-4 flex justify-end">
        <button
          type="button"
          *ngIf="hasMore"
          (click)="loadMore()"
          [disabled]="loading"
          class="rounded-lg border border-gray-200 text-sm text-blue-600 font-medium px-4 py-2 bg-white hover:bg-blue-50 disabled:opacity-60"
        >
          {{ loading ? 'Loading...' : 'Load more' }}
        </button>
      </div>
    </div>
  </div>
</div>
