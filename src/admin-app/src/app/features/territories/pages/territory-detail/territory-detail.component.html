<div class="flex h-screen w-screen overflow-hidden bg-gray-50 font-sans">
  <app-sidebar />

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <app-topbar
      [userName]="userName"
      [userRole]="userRole"
      [title]="territory?.name || 'Territory'"
      [showBack]="true"
      backRoute="/regions"
    />

    <div *ngIf="isLoading" class="flex-1 flex items-center justify-center text-gray-400 text-sm">
      Loading territory...
    </div>

    <div *ngIf="!isLoading && notFound" class="flex-1 flex items-center justify-center text-red-400 text-sm">
      Territory not found.
    </div>

    <div *ngIf="!isLoading && territory" class="flex-1 overflow-y-auto px-8 py-6">
      <div class="flex items-start justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">{{ territory.name }}</h1>
          <p class="text-sm text-gray-500 mt-0.5">
            Territory overview. This entity has no parent entity.
          </p>
        </div>
        <button
          type="button"
          (click)="openProfileModal()"
          class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-blue-700 bg-blue-50 border border-blue-200 rounded-lg hover:bg-blue-100 cursor-pointer transition-colors"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Edit Profile
        </button>
      </div>

      <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden max-w-3xl">
        <div class="px-6 py-4 border-b border-gray-100">
          <h2 class="text-base font-bold text-gray-900">Regions</h2>
        </div>

        <ng-container *ngIf="territory.regions.length > 0; else emptyRegions">
          <button
            *ngFor="let region of territory.regions"
            type="button"
            (click)="goToRegion(region)"
            class="w-full flex items-center justify-between px-6 py-3.5 text-left border-0 border-b border-gray-50 bg-white hover:bg-blue-50/40 cursor-pointer transition-colors"
          >
            <span class="text-sm font-semibold text-gray-800">{{ region.name }}</span>
            <span class="text-xs font-semibold text-blue-700">Open region</span>
          </button>
        </ng-container>

        <ng-template #emptyRegions>
          <div class="px-6 py-8 text-sm text-gray-500">
            No regions are currently attached to this territory.
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>

<app-entity-profile-edit-modal
  [context]="profileModalContext"
  [isOpen]="profileModalOpen"
  (closed)="closeProfileModal()"
/>
