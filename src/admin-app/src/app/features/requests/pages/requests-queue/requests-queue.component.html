<div class="flex h-screen w-screen overflow-hidden bg-gray-50 font-sans">
  <app-sidebar [region]="region" />
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <app-topbar [userName]="userName" [userRole]="userRole" title="Review Queue" />
    <div class="flex-1 overflow-y-auto px-8 py-6">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Review Requests Queue</h1>
        <p class="text-sm text-gray-500 mt-0.5">Manage and process incoming content submissions from regional contributors.</p>
      </div>
      <!-- Filter tabs -->
      <div class="flex gap-2 mb-5">
        <button
          *ngFor="let tab of tabs"
          (click)="activeTab = tab.key"
          class="px-4 py-2 rounded-full text-sm font-semibold transition-all"
          [ngClass]="activeTab === tab.key
            ? 'bg-blue-700 text-white shadow-sm'
            : 'bg-white text-gray-600 border border-gray-200 hover:border-blue-300 hover:text-blue-700'"
        >
          {{ tab.label }}
          <span
            *ngIf="tab.count !== null"
            class="ml-1.5 text-xs font-bold px-1.5 py-0.5 rounded-full"
            [ngClass]="activeTab === tab.key ? 'bg-white/25 text-white' : 'bg-gray-100 text-gray-500'"
          >{{ tab.count }}</span>
        </button>
      </div>
      <!-- Table card -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden"
           style="box-shadow: 0 1px 6px rgba(0,0,0,0.06);">

        <!-- Toolbar -->
        <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-100">

          <!-- Search -->
          <div class="ml-auto flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5 w-52">
            <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
              type="text"
              placeholder="Search requests..."
              [(ngModel)]="searchQuery"
              class="bg-transparent text-sm text-gray-700 outline-none placeholder-gray-400 w-full"
            />
          </div>

          <!-- Sort -->
          <div class="relative">
            <button
              (click)="sortOpen = !sortOpen"
              class="flex items-center gap-1.5 px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-sm text-gray-600 font-medium hover:border-gray-300 cursor-pointer transition-colors"
            >
              <svg class="w-3.5 h-3.5 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
              </svg>
              Sort: {{ currentSort }}
              <svg class="w-3 h-3 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
            <div
              *ngIf="sortOpen"
              class="absolute right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-10 w-40 py-1 overflow-hidden"
            >
              <button
                *ngFor="let opt of sortOptions"
                (click)="currentSort = opt; sortOpen = false"
                class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors cursor-pointer border-none bg-transparent"
                [ngClass]="currentSort === opt ? 'font-semibold text-blue-700 bg-blue-50' : ''"
              >{{ opt }}</button>
            </div>
          </div>
        </div>

        <!-- Pagination footer -->
        <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100 bg-gray-50/40">
          <p class="text-sm text-gray-500">
            Showing <span class="font-semibold text-gray-700">{{ filteredRequests.length }}</span>
            of <span class="font-semibold text-gray-700">{{ requests.length }}</span> requests
          </p>
          <div class="flex items-center gap-2">
            <button class="px-3 py-1.5 rounded-lg text-sm text-gray-500 border border-gray-200 bg-white hover:bg-gray-50 cursor-pointer transition-colors">Previous</button>
            <button class="px-3 py-1.5 rounded-lg text-sm text-gray-500 border border-gray-200 bg-white hover:bg-gray-50 cursor-pointer transition-colors">Next</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
