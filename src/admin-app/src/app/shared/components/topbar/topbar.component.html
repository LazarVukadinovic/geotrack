<header class="flex items-center justify-between px-8 py-3 bg-white border-b border-gray-100 min-h-[56px]">
  <div class="flex items-center gap-3">

    <!-- Back button -->
    <button
      *ngIf="showBack"
      (click)="goBack()"
      class="flex items-center gap-1.5 text-sm font-medium text-gray-500 hover:text-blue-700 transition-colors cursor-pointer border-none bg-transparent p-0 mr-1">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back
    </button>

    <h1 class="text-xl font-bold text-gray-900">{{ title }}</h1>
  </div>
  <div class="flex items-center gap-4">
    <button class="relative p-2 rounded-lg text-gray-500 hover:bg-gray-100 transition bg-transparent border-0 cursor-pointer">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
      <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-blue-500"></span>
    </button>
    <div class="relative">
      <button
        type="button"
        class="flex items-center gap-3 rounded-lg border-0 bg-transparent px-2 py-1 text-left transition-colors hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-100 cursor-pointer"
        aria-haspopup="menu"
        [attr.aria-expanded]="profileMenuOpen"
        aria-controls="admin-profile-menu"
        aria-label="Open user profile menu"
        (click)="toggleProfileMenu($event)"
      >
        <div class="text-right">
          <p class="text-sm font-semibold text-gray-800">{{ displayUserName }}</p>
          <p class="text-xs text-gray-500">{{ displayUserRole }}</p>
        </div>
        <div class="relative flex-shrink-0">
          <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center ring-2 ring-white overflow-hidden">
            <img
              *ngIf="displayAvatarUrl"
              [src]="displayAvatarUrl"
              [alt]="avatarAlt"
              class="w-full h-full object-cover"
              (error)="onAvatarError()"
            />
            <span *ngIf="!displayAvatarUrl" class="text-xs font-bold text-gray-500">{{ userInitials }}</span>
          </div>
          <span class="absolute -right-0.5 -bottom-0.5 w-2.5 h-2.5 rounded-full bg-green-500 ring-2 ring-white block"></span>
        </div>
      </button>

      <div
        *ngIf="profileMenuOpen"
        id="admin-profile-menu"
        role="menu"
        class="absolute right-0 top-full z-50 mt-2 w-72 overflow-hidden rounded-lg border border-gray-100 bg-white shadow-xl"
        style="box-shadow: 0 16px 40px rgba(15, 23, 42, 0.14);"
        (click)="$event.stopPropagation()"
      >
        <div class="flex items-center gap-3 border-b border-gray-100 px-4 py-4">
          <div class="relative flex-shrink-0">
            <div class="w-11 h-11 rounded-full bg-gray-100 flex items-center justify-center overflow-hidden ring-2 ring-gray-100">
              <img
                *ngIf="displayAvatarUrl"
                [src]="displayAvatarUrl"
                [alt]="avatarAlt"
                class="w-full h-full object-cover"
                (error)="onAvatarError()"
              />
              <span *ngIf="!displayAvatarUrl" class="text-sm font-bold text-gray-600">{{ userInitials }}</span>
            </div>
            <span class="absolute -right-0.5 -bottom-0.5 w-3 h-3 rounded-full bg-green-500 ring-2 ring-white block"></span>
          </div>
          <div class="min-w-0">
            <p class="truncate text-sm font-semibold text-gray-900">{{ displayUserName }}</p>
            <p *ngIf="displayUserEmail" class="truncate text-xs text-gray-500">{{ displayUserEmail }}</p>
            <span class="mt-2 inline-flex max-w-full items-center rounded-md bg-blue-50 px-2 py-0.5 text-[11px] font-semibold text-blue-700">
              <span class="truncate">{{ displayUserRole }}</span>
            </span>
          </div>
        </div>

        <div *ngIf="showViewSwitcher" class="border-b border-gray-100 px-2 py-2">
          <p class="px-2 pb-1 pt-1 text-[10px] font-bold uppercase tracking-widest text-gray-400">Switch view</p>
          <button
            *ngFor="let view of availableViews"
            type="button"
            role="menuitemradio"
            [attr.aria-checked]="isActiveView(view)"
            (click)="selectView(view)"
            class="flex w-full items-center gap-2 rounded-md border-0 bg-transparent px-2 py-2 text-left text-sm text-gray-700 transition-colors hover:bg-blue-50 hover:text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-100 cursor-pointer"
            [class.bg-blue-50]="isActiveView(view)"
            [class.text-blue-700]="isActiveView(view)"
            [class.font-semibold]="isActiveView(view)"
          >
            <span class="flex h-5 w-5 items-center justify-center text-blue-600">
              <svg *ngIf="isActiveView(view)" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </span>
            <span class="flex-1">{{ view.label }}</span>
            <span *ngIf="isActiveView(view)" class="text-[11px] font-semibold text-blue-600">Current</span>
          </button>
        </div>

        <div class="px-2 py-2">
          <button
            type="button"
            role="menuitem"
            (click)="openSettings()"
            class="flex w-full items-center gap-2 rounded-md border-0 bg-transparent px-2 py-2 text-left text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-100 cursor-pointer"
          >
            <svg class="h-4 w-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="4" y1="6" x2="20" y2="6" />
              <line x1="4" y1="12" x2="20" y2="12" />
              <line x1="4" y1="18" x2="20" y2="18" />
              <circle cx="8" cy="6" r="2" fill="currentColor" stroke="none" />
              <circle cx="16" cy="12" r="2" fill="currentColor" stroke="none" />
              <circle cx="10" cy="18" r="2" fill="currentColor" stroke="none" />
            </svg>
            <span>Settings</span>
          </button>
          <button
            type="button"
            role="menuitem"
            (click)="signOut()"
            class="mt-1 flex w-full items-center gap-2 rounded-md border-0 bg-transparent px-2 py-2 text-left text-sm font-semibold text-red-600 transition-colors hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-100 cursor-pointer"
          >
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
