<header class="flex items-center justify-between px-8 py-3 bg-white border-b border-gray-100 min-h-[56px]">
  <div>
    <h1 class="text-xl font-bold text-gray-900">{{ title }}</h1>
  </div>
  <div class="flex items-center gap-4">
    <button class="relative p-2 rounded-lg text-gray-500 hover:bg-gray-100 transition bg-transparent border-0 cursor-pointer">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
      <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-blue-500"></span>
    </button>
    <div class="flex items-center gap-3">
      <div class="text-right">
        <p class="text-sm font-semibold text-gray-800">{{ userName }}</p>
        <p class="text-xs text-gray-500">{{ userRole }}</p>
      </div>
      <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center flex-shrink-0 ring-2 ring-white">
        <svg class="w-5 h-5 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </div>
      <span class="w-2.5 h-2.5 rounded-full bg-green-500 ring-2 ring-white block -ml-5 mt-5 flex-shrink-0"></span>
    </div>
  </div>
</header>
