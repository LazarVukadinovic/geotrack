<div class="search-bar">
  <label class="visually-hidden" [attr.for]="resolvedControlId()">
    {{ label() }}
  </label>
  <svg class="search-bar__icon" viewBox="0 0 24 24" aria-hidden="true">
    <path
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      stroke-linecap="round"
      d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Zm0 0L16 21"
    />
  </svg>
  <input
    #searchField
    [id]="resolvedControlId()"
    [attr.name]="resolvedControlName()"
    class="search-bar__input"
    type="search"
    autocomplete="off"
    enterkeyhint="search"
    [attr.placeholder]="placeholder()"
    [value]="local()"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (keydown.enter)="onSubmit($event)"
  />
  @if (local().trim().length > 0) {
    <button
      type="button"
      class="search-bar__clear"
      aria-label="Clear search"
      (click)="clearValue()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6 6 18" />
      </svg>
    </button>
  }
</div>
