@if (visible()) {
  <div class="als__backdrop" aria-hidden="true"></div>

  <section
    class="als__sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="approx-location-title"
  >
    <div class="als__handle" aria-hidden="true"></div>

    <h2 id="approx-location-title" class="als__title">Use approximate location?</h2>
    <p class="als__body">
      If precise location is unavailable, GeoTrack can estimate your area from your network connection to show nearby places. This is less accurate than GPS.
    </p>

    <div class="als__actions">
      <button type="button" class="als__primary" (click)="accept()">Use approximate location</button>
      <button type="button" class="als__secondary" (click)="decline()">Not now</button>
    </div>
  </section>
}
