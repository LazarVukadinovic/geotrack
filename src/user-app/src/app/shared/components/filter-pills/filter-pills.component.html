<nav class="filter-pills" aria-label="Category filters">
  <div class="filter-pills__viewport">
    <ul class="filter-pills__track" role="list">
      @for (opt of options(); track opt.id) {
        <li class="filter-pills__cell">
          <button
            type="button"
            class="filter-pills__pill"
            [class.filter-pills__pill--active]="activeId() === opt.id"
            [attr.aria-pressed]="activeId() === opt.id"
            (click)="select(opt.id)"
          >
            {{ opt.label }}
          </button>
        </li>
      }
    </ul>
  </div>
</nav>
