<div class="section-header">
  <div class="section-header__text">
    <h2 class="section-header__title">{{ title() }}</h2>
    @if (subtitle()) {
      <p class="section-header__subtitle">{{ subtitle() }}</p>
    }
  </div>
  <button type="button" class="section-header__action" (click)="onAction()">
    {{ actionLabel() }}
    <span class="section-header__chevron" aria-hidden="true">›</span>
  </button>
</div>
