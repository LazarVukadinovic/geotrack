@if (displayImageUrl(); as imageSrc) {
  <img
    class="user-avatar__image"
    [src]="imageSrc"
    [alt]="imageAlt()"
    loading="lazy"
    decoding="async"
    (error)="onImageError()"
  />
} @else {
  <span class="user-avatar__fallback" role="img" [attr.aria-label]="fallbackAriaLabel()">
    @if (initials(); as fallbackInitials) {
      <span class="user-avatar__initials">{{ fallbackInitials }}</span>
    } @else {
      <svg class="user-avatar__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
    }
  </span>
}
