<div class="explore-page">
  <app-header
    title="Explore"
    [showBell]="isLoggedIn()"
    [showNotificationDot]="hasUnreadNotifications()"
    (notifications)="onNotifications()"
  />

  <div class="explore-page__main">
    <app-welcome-hero [city]="heroCity()" [country]="heroCountry()" />

    <div class="explore-page__search">
      <app-search-bar
        [value]="searchQuery()"
        controlId="explore-search"
        controlName="exploreSearch"
        label="Search destinations or activities"
        (valueChange)="onSearchChange($event)"
      />
    </div>

    <p class="explore-page__context">{{ contextLine() }}</p>

    @if (loadError()) {
      <app-empty-state
        title="Something went wrong"
        [message]="loadError()!"
      />
    }

    @if (isLoggedIn()) {
      <app-curated-for-you
        [items]="curatedItems()"
        (bookmarkToggled)="toggleCuratedSaved($event)"
        (cardActivated)="onCuratedCard($event)"
        (sectionMore)="onCuratedMore()"
      />
    } @else {
      <app-promo-card [promo]="promo()" (cta)="onPromoCta()" />
    }

    <app-landmarks-slider
      [items]="landmarkCategories()"
      (tileActivated)="onLandmarkTile($event)"
      (sectionMore)="onLandmarksMore()"
    />

    <app-top-stays-slider
      [items]="topStays()"
      [showFavoriteButton]="isLoggedIn()"
      (bookmarkToggled)="toggleStaySaved($event)"
      (cardActivated)="onStayCard($event)"
      (sectionMore)="onStaysMore()"
    />

    <app-events-slider
      [items]="eventsThisWeek()"
      (eventActivated)="onEvent($event)"
      (sectionMore)="onEventsMore()"
    />

    <app-local-favorites-list
      [items]="filteredLocalFavorites()"
      [showFavoriteButton]="isLoggedIn()"
      (bookmarkToggled)="toggleLocalSaved($event)"
      (cardActivated)="onLocalCard($event)"
      (sectionMore)="onLocalMore()"
    />

    <app-must-see-slider
      [items]="mustSeeAttractions()"
      (cardActivated)="onAttractionCard($event)"
      (sectionMore)="onAttractionsMore()"
    />

    <app-popular-nearby-slider
      [items]="popularNearby()"
      [showFavoriteButton]="isLoggedIn()"
      (bookmarkToggled)="toggleNearbySaved($event)"
      (cardActivated)="onNearbyCard($event)"
      (sectionMore)="onNatureMore()"
    />
  </div>
</div>
