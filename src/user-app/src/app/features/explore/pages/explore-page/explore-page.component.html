<div class="explore-page">
  <app-header
    title="Explore"
    [showBell]="isLoggedIn()"
    [showNotificationDot]="hasUnreadNotifications()"
    (notifications)="onNotifications()"
  />

  <div class="explore-page__main">
    <app-welcome-hero [city]="heroCity()" [country]="heroCountry()" />

    <div class="explore-page__search">
      <app-search-bar
        [value]="searchQuery()"
        controlId="explore-search"
        controlName="exploreSearch"
        label="Search destinations or activities"
        (focused)="openSearch()"
      />
    </div>

    <p class="explore-page__context">{{ contextLine() }}</p>

    @if (isDestinationMode()) {
      <div class="explore-page__destination-mode">
        <span>Selected destination: {{ heroCity() }}</span>
        <button type="button" (click)="useCurrentLocation()">Use my location</button>
      </div>
    }

    @if (loadError()) {
      <app-empty-state
        title="Something went wrong"
        [message]="loadError()!"
      />
    }

    @if (!isLoggedIn()) {
      <app-promo-card [promo]="promo()" (cta)="onPromoCta()" />
    }

    @if (!loading() && loaded() && sections().length === 0 && !loadError()) {
      <app-empty-state
        title="No Explore sections yet"
        message="Try another location or add more approved places, events and tags."
      />
    }

    @for (section of sections(); track section.key) {
      <app-explore-section
        [section]="section"
        [showFavoriteButton]="isLoggedIn()"
        (save)="onSectionSave($event)"
        (itemActivated)="onSectionItem($event)"
        (sectionMore)="onSectionMore($event)"
      />
    }
  </div>

  @if (searchOverlayOpen()) {
    <app-search-page (closed)="closeSearch()" />
  }
</div>
