<header class="welcome-hero">
  <p class="welcome-hero__line">
    Welcome to
    @if (destinationRoute()) {
      <a class="welcome-hero__city welcome-hero__link" [routerLink]="destinationRoute()">{{ city() }}</a>
    } @else {
      <span class="welcome-hero__city">{{ city() }}</span>
    }
  </p>
  @if (country()) {
    <p class="welcome-hero__country">
      @if (countryRoute()) {
        <a class="welcome-hero__link" [routerLink]="countryRoute()">{{ country() }}</a>
      } @else {
        {{ country() }}
      }
    </p>
  }
</header>
