<div class="nearby-status" aria-label="Nearby status">

      <path
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 21s7-4.35 7-10a7 7 0 1 0-14 0c0 5.65 7 10 7 10Zm0-8.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z"
      />

    <span class="nearby-status__label">{{ status().label }}</span>
    <span class="nearby-status__value">{{ status().value }}</span>
  </span>
</div>
