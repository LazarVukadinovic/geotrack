<section class="stays-slider" aria-label="Top stays near you">
  <app-section-header
    title="Top Stays"
    subtitle="Highly rated accommodations for your trip"
    actionLabel="More"
    (action)="sectionMore.emit()"
  />

  @if (items().length === 0) {
    <app-empty-state
      title="No stays nearby yet"
      message="This area does not have stored accommodation results yet."
    />
  } @else {
    <div class="stays-slider__viewport">
      <div class="stays-slider__track" data-slider-id="stays" role="list">
        @for (item of items(); track item.id) {
          <article
            class="stays-slider__card"
            role="listitem"
            [attr.data-item-id]="item.id"
            (click)="cardActivated.emit(item.id)"
          >
            <div class="stays-slider__media">
              <img
                class="stays-slider__img"
                [src]="imgSrcById()[item.id]"
                [alt]="''"
                width="200"
                height="130"
                loading="lazy"
                decoding="async"
                (error)="onImgError(item.id)"
              />
              @if (showFavoriteButton()) {
                <app-favorite-button
                  class="stays-slider__save"
                  [saved]="item.isSaved"
                  [itemLabel]="item.title"
                  (clicked)="toggleBookmark(item.id)"
                />
              }
            </div>

            <div class="stays-slider__body">
              <h3 class="stays-slider__title">{{ item.title }}</h3>
              <div class="stays-slider__row">
                @if (item.rating != null) {
                  <span class="stays-slider__rating">
                    <svg class="stays-slider__star" viewBox="0 0 24 24" aria-hidden="true">
                      <path fill="currentColor" d="M12 3.3 14.47 8.9l6.08.53-4.6 4 1.4 5.97L12 16.9l-5.35 3.5 1.39-5.97-4.6-4 6.08-.53L12 3.3Z" />
                    </svg>
                    {{ item.rating!.toFixed(1) }}
                  </span>
                  @if (item.reviewCount) {
                    <span class="stays-slider__reviews">({{ item.reviewCount }})</span>
                  }
                } @else {
                  <span class="stays-slider__reviews stays-slider__reviews--empty">No reviews yet</span>
                }
              </div>
              <p class="stays-slider__distance">{{ item.distance }}</p>
            </div>
          </article>
        }
      </div>
    </div>
  }
</section>
