<section class="local-favorites" aria-label="Local favorites">
  <app-section-header
    title="Local Favorites"
    actionLabel="More"
    (action)="sectionMore.emit()"
  />

  @if (items().length === 0) {
    <app-empty-state title="No matches" message="Try another search or category." />
  } @else {
    <div class="local-favorites__viewport">
      <div class="local-favorites__track" role="list">
        @for (item of items(); track item.id) {
          <div class="local-favorites__cell" role="listitem">
            <app-destination-card
              [item]="item"
              (bookmarkToggled)="bookmarkToggled.emit($event)"
              (cardActivated)="cardActivated.emit($event)"
            />
          </div>
        }
      </div>
    </div>
  }
</section>
