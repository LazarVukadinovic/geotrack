<div class="px-5 pt-6 pb-28 flex flex-col gap-6">

  <!-- Cover Image -->
  <div>
    <p class="text-sm font-bold text-slate-700 mb-3">Cover Image</p>
    <div class="relative h-48 rounded-2xl overflow-hidden bg-slate-100 border-2 border-dashed border-slate-300"
      [class.border-0]="previewUrl">
      <img *ngIf="previewUrl" [src]="previewUrl" class="w-full h-full object-cover"/>
      <div *ngIf="!previewUrl" class="absolute inset-0 flex flex-col items-center justify-center gap-2">
        <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 16M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span class="text-sm text-slate-400">Tap to add photo</span>
      </div>
      <button *ngIf="previewUrl"
        class="absolute inset-0 flex items-center justify-center bg-black/30">
        <div class="bg-white/90 rounded-xl px-4 py-2 flex items-center gap-2">
          <svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 16M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <span class="text-sm font-semibold text-slate-700">Replace Photo</span>
        </div>
      </button>
      <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" (change)="onImageSelected($event)"/>
    </div>
  </div>

  <!-- Stay Name -->
  <div>
    <label class="text-sm font-bold text-slate-700 mb-2 block">Stay Name</label>
    <div class="bg-white border border-slate-200 rounded-2xl flex items-center gap-3 px-4 py-3.5">
      <svg class="w-4 h-4 text-slate-400 flex-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      <input type="text" [(ngModel)]="form.name" placeholder="e.g. Azure Infinity Villa"
        class="flex-1 text-sm text-slate-700 placeholder-slate-300 outline-none bg-transparent"/>
    </div>
  </div>

  <!-- Stay Type -->
  <div>
    <label class="text-sm font-bold text-slate-700 mb-3 block">Stay Type</label>
    <div class="flex gap-2 flex-wrap">
      <button *ngFor="let type of stayTypes"
        (click)="form.stayType = type"
        class="px-4 py-2 rounded-full text-sm font-semibold border transition-all duration-200"
        [class.bg-[#e8722a]]="form.stayType === type"
        [class.border-[#e8722a]]="form.stayType === type"
        [class.text-white]="form.stayType === type"
        [class.bg-white]="form.stayType !== type"
        [class.border-slate-200]="form.stayType !== type"
        [class.text-slate-600]="form.stayType !== type">
        {{ type }}
      </button>
    </div>
  </div>

  <!-- Location Details -->
  <div>
    <div class="flex items-center gap-2 mb-3">
      <svg class="w-4 h-4 text-[#e8722a]" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
      </svg>
      <label class="text-sm font-bold text-slate-700">Location Details</label>
    </div>
    <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
      <div class="px-4 py-3.5 border-b border-slate-100">
        <input type="text" [(ngModel)]="form.address" placeholder="Street address"
          class="w-full text-sm text-slate-700 placeholder-slate-300 outline-none bg-transparent"/>
      </div>
      <div class="flex">
        <div class="flex-1 px-4 py-3.5 border-r border-slate-100">
          <input type="text" [(ngModel)]="form.city" placeholder="City"
            class="w-full text-sm text-slate-700 placeholder-slate-300 outline-none bg-transparent"/>
        </div>
        <div class="flex-1 px-4 py-3.5">
          <input type="text" [(ngModel)]="form.region" placeholder="Region"
            class="w-full text-sm text-slate-700 placeholder-slate-300 outline-none bg-transparent"/>
        </div>
      </div>
      <div class="px-4 py-3.5 border-t border-slate-100 flex items-center gap-2">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064"/>
        </svg>
        <input type="text" [(ngModel)]="form.country" placeholder="Country"
          class="flex-1 text-sm text-slate-700 placeholder-slate-300 outline-none bg-transparent"/>
      </div>
    </div>

    <button class="mt-3 w-full py-3 border border-dashed border-slate-300 rounded-2xl flex items-center justify-center gap-2 text-slate-500 text-sm font-semibold active:bg-slate-50 transition-colors">
      <svg class="w-4 h-4 text-[#e8722a]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z"/>
      </svg>
      Pin Coordinates
    </button>
  </div>
</div>

<!-- Continue button -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-5 py-4" style="padding-bottom: max(1rem, env(safe-area-inset-bottom))">
  <button (click)="onContinue()"
    [disabled]="!isValid()"
    class="w-full py-4 bg-[#e8722a] rounded-3xl text-white font-bold text-base transition-all duration-200 active:scale-[0.98] disabled:opacity-40">
    Continue
  </button>
</div>
