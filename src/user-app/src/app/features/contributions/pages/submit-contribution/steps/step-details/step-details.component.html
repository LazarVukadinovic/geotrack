<div class="px-5 pt-6 pb-6 flex flex-col gap-5">

  <!-- About -->
  <div class="bg-white rounded-2xl p-5">
    <h3 class="text-base font-bold text-slate-800 mb-1">About this stay</h3>
    <p class="text-xs text-slate-500 mb-4">Provide details to help guests understand what makes this place special.</p>

    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <label class="text-sm font-semibold text-slate-700">Description</label>
        <span class="text-xs text-slate-400">{{ form.description.length }}/500</span>
      </div>
      <textarea [(ngModel)]="form.description" (ngModelChange)="changed.emit({...form})" maxlength="500" rows="5"
        placeholder="Describe the atmosphere, surroundings, and unique features..."
        class="w-full border border-slate-200 rounded-xl p-3 text-sm text-slate-700 placeholder-slate-300 outline-none resize-none focus:border-[#e8722a] transition-colors">
      </textarea>
    </div>

    <div class="mb-4">
      <label class="text-sm font-semibold text-slate-700 mb-2 block">Contact Phone <span class="text-slate-400 font-normal">(Optional)</span></label>
      <div class="flex items-center gap-3 border border-slate-200 rounded-xl px-4 py-3 focus-within:border-[#e8722a] transition-colors">
        <svg class="w-4 h-4 text-slate-400 flex-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        </svg>
        <input type="tel" [(ngModel)]="form.phone" (ngModelChange)="changed.emit({...form})" placeholder="+1 (555) 000-0000"
          class="flex-1 text-sm text-slate-700 placeholder-slate-300 outline-none bg-transparent"/>
      </div>
    </div>

    <div>
      <label class="text-sm font-semibold text-slate-700 mb-2 block">Official Website <span class="text-slate-400 font-normal">(Optional)</span></label>
      <div class="flex items-center gap-3 border border-slate-200 rounded-xl px-4 py-3 focus-within:border-[#e8722a] transition-colors">
        <svg class="w-4 h-4 text-slate-400 flex-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064"/>
        </svg>
        <input type="url" [(ngModel)]="form.website" (ngModelChange)="changed.emit({...form})" placeholder="https://www.example.com"
          class="flex-1 text-sm text-slate-700 placeholder-slate-300 outline-none bg-transparent"/>
      </div>
    </div>
  </div>

  <!-- Booking Partners -->
  <div class="bg-white rounded-2xl p-5">
    <h3 class="text-base font-bold text-slate-800 mb-1">Booking Partners</h3>
    <p class="text-xs text-slate-500 mb-4">Booking buttons will appear on the stay detail page to help users find reservations.</p>

    <div class="flex flex-col gap-2">
      <button *ngFor="let partner of bookingPartners"
        (click)="togglePartner(partner.id)"
        class="flex items-center gap-3 px-4 py-3.5 border rounded-xl transition-all duration-200"
        [class.border-[#e8722a]]="isPartnerSelected(partner.id)"
        [class.bg-orange-50]="isPartnerSelected(partner.id)"
        [class.border-slate-200]="!isPartnerSelected(partner.id)">
        <span class="flex-1 text-sm font-semibold text-slate-700 text-left">{{ partner.label }}</span>
        <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all"
          [class.border-[#e8722a]]="isPartnerSelected(partner.id)"
          [class.bg-[#e8722a]]="isPartnerSelected(partner.id)"
          [class.border-slate-300]="!isPartnerSelected(partner.id)">
          <svg *ngIf="isPartnerSelected(partner.id)" class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
      </button>
    </div>
  </div>
  <div class="mt-auto flex gap-3">
    <button (click)="back.emit()" class="flex-none px-6 py-4 border border-slate-200 rounded-3xl text-slate-700 font-bold text-base active:bg-slate-50 transition-colors">Back</button>
    <button (click)="onContinue()" class="flex-1 py-4 bg-[#e8722a] rounded-3xl text-white font-bold text-base transition-all active:scale-[0.98]">Continue</button>
  </div>
</div>
