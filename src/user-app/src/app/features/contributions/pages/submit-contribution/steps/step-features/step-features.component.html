<div class="px-5 pt-6 pb-32 flex flex-col gap-6">

  <!-- Characteristics -->
  <div class="bg-white rounded-2xl p-5">
    <h3 class="text-base font-bold text-slate-800 mb-1">Stay Characteristics</h3>
    <p class="text-xs text-slate-500 mb-4">Select tags that best describe the vibe and setting.</p>
    <div class="flex flex-wrap gap-2">
      <button *ngFor="let tag of characteristicTags"
        (click)="toggleTag(tag)"
        class="flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-semibold border transition-all duration-200"
        [class.bg-[#e8722a]]="isTagSelected(tag)"
        [class.border-[#e8722a]]="isTagSelected(tag)"
        [class.text-white]="isTagSelected(tag)"
        [class.bg-white]="!isTagSelected(tag)"
        [class.border-slate-200]="!isTagSelected(tag)"
        [class.text-slate-600]="!isTagSelected(tag)">
        <svg *ngIf="isTagSelected(tag)" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
        </svg>
        {{ tag }}
      </button>
    </div>
  </div>

  <!-- Amenities -->
  <div class="bg-white rounded-2xl p-5">
    <h3 class="text-base font-bold text-slate-800 mb-1">Available Amenities</h3>
    <p class="text-xs text-slate-500 mb-4">Selected amenities will appear prominently on the stay detail page.</p>
    <div class="grid grid-cols-4 gap-3">
      <button *ngFor="let amenity of amenities"
        (click)="toggleAmenity(amenity.id)"
        class="flex flex-col items-center gap-1.5 p-3 rounded-2xl border-2 transition-all duration-200"
        [class.border-[#e8722a]]="isAmenitySelected(amenity.id)"
        [class.bg-orange-50]="isAmenitySelected(amenity.id)"
        [class.border-slate-200]="!isAmenitySelected(amenity.id)"
        [class.bg-white]="!isAmenitySelected(amenity.id)">
        <span class="text-[10px] font-bold tracking-wide"
          [class.text-[#e8722a]]="isAmenitySelected(amenity.id)"
          [class.text-slate-500]="!isAmenitySelected(amenity.id)">
          {{ amenity.label }}
        </span>
      </button>
    </div>
  </div>
</div>

<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-5 py-4 flex gap-3" style="padding-bottom: max(1rem, env(safe-area-inset-bottom))">
  <button (click)="back.emit()"
    class="flex-none px-6 py-4 border border-slate-200 rounded-3xl text-slate-700 font-bold text-base active:bg-slate-50 transition-colors">
    Back
  </button>
  <button (click)="onContinue()"
    class="flex-1 py-4 bg-[#e8722a] rounded-3xl text-white font-bold text-base transition-all active:scale-[0.98]">
    Continue
  </button>
</div>
