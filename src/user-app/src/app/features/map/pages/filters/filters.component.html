<div class="min-h-screen flex flex-col bg-[#fafaf9]">

  <!-- Header -->
  <div style="background: linear-gradient(to bottom, #2d4a7a 0%, #5b7fa6 40%, #a8c4d8 70%, #fafaf9 100%);"
    class="px-6 pt-10 pb-10">
    <div class="pt-6 flex items-center justify-between mb-6">
      <button (click)="goBack()" class="w-8 h-8 flex items-center justify-center text-white/80">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <span class="text-sm font-bold text-white/90 tracking-wide">Filters</span>
      <button (click)="clearAll()" class="text-xs font-semibold text-white/60">Clear all</button>
    </div>
    <h1 class="text-2xl font-bold text-[#0f172a] tracking-tight mb-1">Choose filters</h1>
    <p class="text-base text-slate-600">Select which backend-backed results to show on the map.</p>
  </div>

  <!-- Content -->
  <div class="flex-1 px-6 pt-6 pb-6 flex flex-col">

    <!-- Categories section -->
    <p class="ml-1 text-[11px] font-bold tracking-[0.15em] text-slate-500 uppercase mb-3">Categories</p>
    <div
      class="flex flex-wrap justify-center gap-2"
      [class.mb-4]="availableMoreFilters().length > 0"
      [class.mb-8]="availableMoreFilters().length === 0">
      <button
        *ngFor="let cat of allCategories"
        (click)="toggleCategory(cat)"
        class="inline-flex items-center gap-2 px-4 py-2.5 rounded-full border text-sm font-medium transition-colors duration-200"
        [class.bg-[#1a2b4a]]="isSelected(cat)"
        [class.border-[#1a2b4a]]="isSelected(cat)"
        [class.text-white]="isSelected(cat)"
        [class.bg-white]="!isSelected(cat)"
        [class.border-slate-200]="!isSelected(cat)"
        [class.text-slate-600]="!isSelected(cat)">
        {{ cat.label }}
      </button>
    </div>

    @if (availableMoreFilters().length > 0) {
      <div class="flex flex-wrap justify-center gap-2 mb-8" role="list" aria-label="Backend map categories">
        <button
          *ngFor="let filter of availableMoreFilters()"
          (click)="toggleMoreFilter(filter)"
          class="inline-flex max-w-full items-center gap-2 px-4 py-2.5 rounded-full border text-sm font-medium transition-colors duration-200"
          [class.bg-[#1a2b4a]]="isMoreFilterSelected(filter)"
          [class.border-[#1a2b4a]]="isMoreFilterSelected(filter)"
          [class.text-white]="isMoreFilterSelected(filter)"
          [class.bg-white]="!isMoreFilterSelected(filter)"
          [class.border-slate-200]="!isMoreFilterSelected(filter)"
          [class.text-slate-600]="!isMoreFilterSelected(filter)">
          <span>{{ filter.label }}</span>
          <span
            class="min-w-5 h-5 px-1 rounded-full text-[11px] font-bold flex items-center justify-center"
            [class.text-white]="isMoreFilterSelected(filter)"
            [class.bg-slate-100]="!isMoreFilterSelected(filter)"
            [class.text-slate-500]="!isMoreFilterSelected(filter)"
            [style.background-color]="isMoreFilterSelected(filter) ? 'rgba(255, 255, 255, 0.2)' : null">
            {{ filter.count }}
          </span>
        </button>
      </div>
    }

    <div class="rounded-2xl border border-slate-200 bg-white px-4 py-3 mb-8">
      <p class="text-sm font-semibold text-slate-700">Map scope</p>
      <p class="text-xs text-slate-500 mt-1">The map loads only what's currently in view, so results scale with how you pan and zoom. Distance presets aren't needed.</p>
    </div>

    <!-- Apply button -->
    <button
      (click)="applyFilters()"
      class="w-full py-3.5 bg-[#e8570a] hover:bg-[#d4621f] active:scale-[0.98] rounded-3xl text-white font-bold text-base tracking-wide flex items-center justify-center gap-3 transition-all duration-200">
      Apply Filters
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
      </svg>
    </button>
  </div>

</div>
