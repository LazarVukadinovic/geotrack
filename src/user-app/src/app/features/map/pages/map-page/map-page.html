<div class="flex flex-col h-screen bg-gray-50 overflow-hidden">

  <!-- ── MAP ── -->
  <div class="flex-1 relative overflow-hidden">
    <div id="map" class="absolute inset-0 w-full h-full"></div>

    <!-- Loading -->
    <div *ngIf="isLoading"
      class="absolute inset-0 flex items-center justify-center bg-white/60"
      style="z-index: 5;">
      <div class="w-7 h-7 border-2 border-[#e8722a] border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- ── SEARCH BAR + CHIPS  ── -->
    <div class="absolute top-0 left-0 right-0 px-4 pt-12 pb-3" style="z-index: 5;">
      <!-- Search bar -->
      <div class="relative mb-3">
        <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
          </svg>
        </div>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (input)="onSearchInput($any($event.target).value)"
          [placeholder]="destinationName"
          class="w-full pl-10 pr-10 py-3 bg-white rounded-2xl text-sm font-medium text-slate-700 outline-none shadow-md"
        />
        <button (click)="goBack()"
          class="absolute inset-y-0 right-3 flex items-center text-[#e8722a]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 19l-7-7 7-7M5 12h14"/>
          </svg>
        </button>
      </div>

      <!-- Search results — absolute -->
      <div *ngIf="searchResults.length > 0"
        class="absolute left-4 right-4 bg-white rounded-2xl shadow-xl overflow-hidden"
        style="top: 105px; z-index: 20;">
        <ul>
          <li *ngFor="let result of searchResults"
            (click)="selectSearchResult(result)"
            class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 cursor-pointer border-b border-slate-50 last:border-0">
            <div class="flex-none w-6 h-6 bg-orange-50 rounded-full flex items-center justify-center">
              <svg class="w-3 h-3 text-[#e8722a]" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
              </svg>
            </div>
            <div class="min-w-0">
              <p class="text-sm font-medium text-slate-800 truncate">{{ result.display_name?.split(',')[0] }}</p>
              <p class="text-xs text-slate-400 truncate">{{ result.display_name?.split(',').slice(1,3).join(',') }}</p>
            </div>
          </li>
        </ul>
      </div>

      <!-- Category chips -->
      <div class="flex gap-3 overflow-x-auto scrollbar-hide mt-4 pb-2">
        <button
          *ngFor="let cat of categories"
          (click)="selectCategory(cat)"
          class="flex-none px-5 py-2 rounded-full border text-sm font-semibold transition-colors duration-200 whitespace-nowrap shadow-sm"
          [class.bg-[#1a2b4a]]="activeCategory === cat.id"
          [class.border-[#1a2b4a]]="activeCategory === cat.id"
          [class.text-white]="activeCategory === cat.id"
          [class.bg-white]="activeCategory !== cat.id"
          [class.border-slate-200]="activeCategory !== cat.id"
          [class.text-slate-600]="activeCategory !== cat.id">
          {{ cat.label }}
        </button>
        <button (click)="router.navigate(['/filters'])"
          class="flex-none px-5 py-2 rounded-full border text-sm font-semibold whitespace-nowrap shadow-sm bg-white border-slate-200 text-slate-600 flex items-center gap-1">
          More
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="absolute right-3 flex flex-col gap-3" style="z-index: 5; top:170px;">

  <!-- Zoom group -->
  <div class="bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden flex flex-col">

    <button (click)="zoomIn()"
      class="w-10 h-10 flex items-center justify-center text-slate-600 text-lg font-light active:bg-slate-50 transition">
      +
    </button>
    <div class="h-px bg-slate-100"></div>
    <button (click)="zoomOut()"
      class="w-10 h-10 flex items-center justify-center text-slate-600 text-lg font-light active:bg-slate-50 transition">
      −
    </button>
  </div>

  <!-- Filter button -->
  <!-- <button
    class="w-10 h-10 bg-white rounded-2xl shadow-md border border-slate-100 flex items-center justify-center text-slate-500 active:scale-95 transition-all">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M3 4h18M7 12h10M11 20h2"/>
    </svg>
  </button> -->

</div>

    <!-- Locate me -->
    <button
      (click)="locateMe()"
      class="absolute bottom-4 right-3 w-11 h-11 bg-[#e8722a] rounded-full shadow-lg flex items-center justify-center active:scale-95 transition-all"
      style="z-index: 5;">
      <svg *ngIf="!isLocating" class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06z"/>
      </svg>
      <div *ngIf="isLocating" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
    </button>

    <!-- Place detail popup -->
    <div *ngIf="selectedPlace"
      class="absolute bottom-4 left-3 right-3 bg-white rounded-2xl shadow-xl overflow-hidden"
      style="z-index: 10;">

      <div class="flex gap-3 p-4">
        <div class="flex-none w-20 h-20 bg-slate-100 rounded-xl overflow-hidden relative">
          <div class="absolute inset-0 flex items-center justify-center">
            <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            </svg>
          </div>
          <button class="absolute top-1 right-1 w-6 h-6 bg-white rounded-full shadow flex items-center justify-center">
            <svg class="w-3.5 h-3.5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
          </button>
        </div>

        <div class="flex-1 min-w-0">
          <h3 class="text-base font-bold text-slate-800 leading-tight mb-0.5">{{ selectedPlace.name }}</h3>
          <p class="text-xs text-slate-400 mb-1.5">{{ selectedPlace.category }}</p>
          <div class="flex items-center gap-3 text-xs text-slate-500">
            <span class="flex items-center gap-1">
              <svg class="w-3.5 h-3.5 text-amber-400" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
              </svg>
              {{ selectedPlace.rating }}
            </span>
            <span class="text-slate-300">•</span>
            <span class="flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              </svg>
              {{ selectedPlace.distance }}
            </span>
          </div>
          <p class="text-xs text-green-500 font-medium mt-1">{{ selectedPlace.status }}</p>
        </div>

        <button (click)="selectedPlace = null"
          class="flex-none self-start w-6 h-6 flex items-center justify-center text-slate-300 hover:text-slate-500 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="flex gap-2 px-4 pb-4">
        <button class="flex-1 py-3 bg-[#e8722a] rounded-2xl text-white text-sm font-bold active:scale-[0.98] transition-all">
          View Details
        </button>
        <button class="flex-1 py-3 bg-white border border-slate-200 rounded-2xl text-slate-700 text-sm font-semibold flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          </svg>
          Directions
        </button>
      </div>
    </div>
  </div>

  <!-- ── BOTTOM NAV ── -->
  <div class="flex-none bg-white border-t border-slate-100 px-2 py-2 flex justify-around items-center safe-area-bottom">

    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400" (click)="activeTab = 'explore'">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" stroke-width="1.5"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M16.24 7.76l-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/>
      </svg>
      <span class="text-[9px] font-medium">Explore</span>
    </button>

    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-[#e8722a]" (click)="activeTab = 'map'">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      <span class="text-[9px] font-bold">Map</span>
    </button>

    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400" (click)="activeTab = 'chat'">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="14" rx="2" stroke-width="1.5"/>
        <path stroke-linecap="round" stroke-width="1.5" d="M7 8h10M7 11.5h6"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 17l3 4"/>
      </svg>
      <span class="text-[9px] font-medium">Ask Agent</span>
    </button>

    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400" (click)="router.navigate(['/login'])">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
      <span class="text-[9px] font-medium">Profile</span>
    </button>

  </div>

</div>
