<div class="lp-page">

  <!-- ── Fixed top bar ────────────────────────────────────────────────────── -->
  <header class="lp-page__topbar">
    <button type="button" class="lp-page__back" aria-label="Go back" (click)="goBack()">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7" />
      </svg>
    </button>
    <span class="lp-page__topbar-title">Local Places &amp; Landmarks</span>
    <div class="lp-page__topbar-spacer"></div>
  </header>

  <!-- ── Scrollable content ───────────────────────────────────────────────── -->
  <div class="lp-page__scroll">

    <!-- Intro -->
    <div class="lp-page__intro">
      <h1 class="lp-page__title">Local Places &amp; Landmarks</h1>
      <div class="lp-page__title-accent" aria-hidden="true"></div>
      <p class="lp-page__subtitle">Browse places by category</p>
    </div>

    <!-- 2-column category grid -->
    <div class="lp-page__grid" role="list" aria-label="Place categories">
      @for (cat of categories(); track cat.id) {
        <button
          type="button"
          class="lp-tile lp-tile--linked"
          role="listitem"
          [attr.aria-label]="cat.title"
          (click)="onTileClick(cat.categoryKey)"
        >
          <img
            class="lp-tile__img"
            [src]="imgSrcById()[cat.id]"
            [alt]="''"
            loading="lazy"
            decoding="async"
            (error)="onImgError(cat.id)"
          />
          <div class="lp-tile__overlay" aria-hidden="true"></div>
          <span class="lp-tile__label">{{ cat.title }}</span>
          <span class="lp-tile__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </span>
        </button>
      }
    </div>

  </div>
</div>
