<div class="min-h-screen flex flex-col bg-[#fafafa] pb-10">

  <!-- Header -->
  <div class="bg-[#1a2b4a] px-6 pt-12 pb-6 rounded-b-[2.5rem]">
    <div class="flex items-center justify-between">
      <button type="button" (click)="goBack()"
        class="w-9 h-9 bg-white/15 rounded-full flex items-center justify-center text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7" />
        </svg>
      </button>
      <span class="text-xl font-medium text-white tracking-wide">My Collections</span>
      <div class="w-9 h-9"></div>
    </div>
  </div>
    <p class="text-center text-[13px] text-slate-500 mt-4 mx-5 tracking-wide">Places you've saved, organised your way</p>
  <div class="grid grid-cols-2 gap-3 px-5 mt-6">

    @for (col of collections(); track col.id) {
      <button
        type="button"
        class="bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col text-left active:scale-[0.98] active:bg-slate-50 transition-transform"
        [attr.aria-label]="col.title"
        (click)="onTileClick(col.id)"
      >
        <!-- Cover area -->
        <div class="relative w-full aspect-square overflow-hidden flex">

          <!-- 0 places -->
          @if (col.placeCount === 0) {
            <div class="w-full h-full bg-slate-100 flex items-center justify-center">
              <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                   stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 16M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
            </div>
          }

          <!-- 1 place -->
          @if (col.placeCount === 1) {
            <img [src]="col.coverImages[0]" class="w-full h-full object-cover" />
          }

          <!-- 2 places -->
          @if (col.placeCount === 2) {
            <img [src]="col.coverImages[0]" class="w-1/2 h-full object-cover border-r-2 border-white" />
            <img [src]="col.coverImages[1]" class="w-1/2 h-full object-cover" />
          }

          <!-- 3+ places -->
          @if (col.placeCount >= 3) {
            <img [src]="col.coverImages[0]" class="w-1/2 h-full object-cover border-r-2 border-white" />
            <div class="w-1/2 h-full flex flex-col">
              <img [src]="col.coverImages[1]" class="w-full h-1/2 object-cover border-b-2 border-white" />
              <img [src]="col.coverImages[2]" class="w-full h-1/2 object-cover" />
            </div>
          }

          <!-- Arrow badge -->
          <span class="absolute top-2 right-2 w-5 h-5 bg-white rounded-full flex items-center justify-center shadow-sm pointer-events-none">
            <svg class="w-2.5 h-2.5 text-[#1a2b4a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </span>
        </div>

        <!-- Label -->
        <div class="px-3 pt-2.5 pb-3 flex flex-col gap-0.5">
          <span class="text-[16px] font-semibold text-slate-800 truncate">{{ col.title }}</span>
          <span class="text-[12px] text-slate-600">{{ col.placeCount }} {{ col.placeCount === 1 ? 'place' : 'places' }}</span>
        </div>
      </button>
    }

    <!-- New Collection tile -->
    <button
      type="button"
      class="bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col text-left active:bg-slate-50 transition-colors"
      aria-label="Create new collection"
      (click)="newSheet.open()"
    >
      <div class="w-full aspect-square border-b border-dashed border-slate-200 flex items-center justify-center">
        <svg class="w-7 h-7 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </div>
      <div class="px-3 pt-2.5 pb-3 flex flex-col gap-0.5">
        <span class="text-[14px] font-semibold text-slate-800">New Collection</span>
        <span class="text-[12px] text-slate-500">Create one</span>
      </div>
    </button>

  </div>
  
  <app-new-collection-sheet
    #newSheet
    (created)="onCollectionCreated($event)">
  </app-new-collection-sheet>

  <!-- Empty state -->
  @if (collections().length === 0) {
    <div class="px-5 mt-10 text-center">
      <p class="text-sm text-slate-400">No collections yet. Tap + to create your first one.</p>
    </div>
  }

</div>
