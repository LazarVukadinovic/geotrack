<div class="min-h-screen flex flex-col bg-[#fafafa]">

  <!-- Header -->
  <div class="bg-[#1a2b4a] px-6 pt-6 pb-6 rounded-b-[2.5rem]">
    <div class="flex items-center justify-between">
      <button (click)="goBack()" class="w-9 h-9 bg-white/15 rounded-full flex items-center justify-center text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <span class="text-[16] font-bold text-white tracking-wide">Edit Profile</span>
      <div class="w-9"></div>
    </div>
  </div>

  <!-- Avatar -->
  <div class="flex justify-center mt-4 mb-8 z-10 relative">
    <div class="relative">
      <div class="w-28 h-28 rounded-full bg-slate-300 border-4 border-white flex items-center justify-center shadow-xl overflow-hidden">
        <svg class="w-16 h-16 text-white/70" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>
      <button class="absolute bottom-1 right-1 w-8 h-8 bg-[#e8570a] rounded-full flex items-center justify-center shadow-lg border-2 border-white">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Form -->
  <div class="flex-1 px-5 pb-10 flex flex-col gap-5">

    <!-- Save error -->
    @if (saveError) {
      <div class="px-4 py-3 bg-red-50 border border-red-200 rounded-2xl text-sm text-red-600 text-center">
        {{ saveError }}
      </div>
    }

    <!-- Save success -->
    @if (saveSuccess) {
      <div class="px-4 py-3 bg-green-50 border border-green-200 rounded-2xl text-sm text-green-700 text-center font-medium">
        Profile updated successfully!
      </div>
    }

    <!-- Full Name -->
    <div>
      <label class="ml-2 text-[12px] font-bold tracking-[0.15em] text-slate-500 uppercase mb-2 block">
        Full Name
      </label>
      <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <div class="flex items-center gap-3 px-4 py-3.5">
          <div class="w-8 h-8 bg-blue-50 rounded-full flex items-center justify-center flex-none">
            <svg class="w-4 h-4 text-[#1a2b4a]" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </div>
          <input type="text" [(ngModel)]="fullName" placeholder="Your full name"
            class="flex-1 text-base text-slate-700 placeholder-slate-300 outline-none bg-transparent"/>
        </div>
      </div>
    </div>

    <!-- Email -->
    <div>
      <label class="ml-2 text-[12px] font-bold tracking-[0.15em] text-slate-500 uppercase mb-2 block">
        Email Address
      </label>
      <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
  <div class="flex items-center gap-3 px-4 py-3.5">
    <div class="w-8 h-8 bg-blue-50 rounded-full flex items-center justify-center flex-none">
      <svg class="w-4 h-4 text-[#1a2b4a]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
    </div>
    <input type="email" [(ngModel)]="email" placeholder="your@email.com"
      class="flex-1 text-base text-slate-700 placeholder-slate-300 outline-none bg-transparent"/>
  </div>
</div>
      <div class="flex items-center gap-1.5 mt-2 ml-2">
        <svg class="w-3 h-3 text-[#1a2b4a]" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
        <span class="text-[11px] font-bold text-[#1a2b4a] tracking-widest uppercase">Verified</span>
        <span class="text-[11px] text-slate-500">· Visible only to you</span>
      </div>
    </div>

    <!-- Phone -->
    <div>
      <label class="ml-2 text-[12px] font-bold tracking-[0.15em] text-slate-500 uppercase mb-2 block">
        Phone Number <span class="normal-case font-normal text-slate-400 tracking-normal">(Optional)</span>
      </label>
    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
  <div class="flex items-center gap-3 px-4 py-3.5">
    <div class="w-8 h-8 bg-blue-50 rounded-full flex items-center justify-center flex-none">
      <svg class="w-4 h-4 text-[#1a2b4a]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
      </svg>
    </div>
    <input type="tel" [(ngModel)]="phone" placeholder="+1 234 567 890"
      class="flex-1 text-base text-slate-700 placeholder-slate-300 outline-none bg-transparent"/>
  </div>
</div>
    </div>

    <!-- Location -->
    <div>
      <label class="ml-2 text-[12px] font-bold tracking-[0.15em] text-slate-500 uppercase mb-2 block">
        Location <span class="normal-case font-normal text-slate-400 tracking-normal">(Optional)</span>
      </label>
    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
  <div class="flex items-center gap-3 px-4 py-3.5">
    <div class="w-8 h-8 bg-blue-50 rounded-full flex items-center justify-center flex-none">
      <svg class="w-4 h-4 text-[#1a2b4a]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </div>
    <input type="text" [(ngModel)]="location" placeholder="e.g. Belgrade, Serbia"
      class="flex-1 text-base text-slate-700 placeholder-slate-300 outline-none bg-transparent"/>
  </div>
</div>
    </div>

    <!-- Spacer -->
    <div class="flex-1"></div>

    <!-- Save button -->
    <button
      (click)="saveChanges()"
      [disabled]="isSaving"
      class="w-full py-4 bg-[#e8570a] hover:bg-[#d4621f] active:scale-[0.98] rounded-3xl text-white font-bold text-base tracking-wide flex items-center justify-center gap-3 transition-all duration-200 shadow-lg"
      [class.opacity-70]="isSaving">
      <div *ngIf="isSaving" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      <span>{{ isSaving ? 'Saving…' : 'Save Changes' }}</span>
    </button>

    <!-- Cancel -->
    <button (click)="goBack()"
      class="w-full py-3 text-base font-bold text-[#1a2b4a] text-center active:opacity-60 transition-opacity">
      Cancel
    </button>

    <!-- Footer note -->
    <p class="text-center text-[12px] text-slate-400 leading-relaxed px-4 pb-2">
      <svg class="w-3 h-3 inline-block mr-1 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      Your personal data is encrypted and stored securely. Read our 
      <a href="#" class="text-[#e8570a] font-semibold">Privacy Policy</a> to learn more.
    </p>

  </div>
</div>
