<div class="min-h-screen flex flex-col bg-[#fafafa] pb-24">

  <!-- Header -->
  <div class="bg-[#1a2b4a] px-6 pt-12 pb-6 rounded-b-[2.5rem] relative">
    <div class="flex items-center justify-between">
      <div class="w-9 h-9"></div>
      <span class="text-xl font-medium text-white tracking-wide">Profile</span>
      <button (click)="goToSettings()" class="w-9 h-9 bg-white/15 rounded-full flex items-center justify-center text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Avatar + Name -->
  <div class="flex flex-col items-center mt-4 px-5">
    <div class="w-24 h-24 rounded-full bg-slate-300 border-4 border-white shadow-lg flex items-center justify-center">
      <svg class="w-14 h-14 text-white/70" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
    </div>
    <h2 class="mt-3 text-xl font-bold text-slate-800">{{ fullName }}</h2>
    <p class="text-sm text-slate-400 mt-0.5">{{ email }}</p>
    <button (click)="editProfile()"
      class="mt-4 flex items-center gap-2 px-6 py-2.5 border border-[#e8722a] rounded-full text-[#e8722a] text-sm font-semibold active:bg-orange-50 transition-colors">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
      </svg>
      Edit Profile
    </button>
  </div>

<!-- Settings & Preferences -->
<div class="px-5 mt-6">
  <p class="ml-1 text-[11px] font-bold tracking-[0.15em] text-slate-500 uppercase mb-2">Settings & Preferences</p>
  <div class="bg-white rounded-2xl shadow-sm overflow-hidden">

    <button (click)="goToInterests()" class="w-full flex items-center gap-3 px-4 py-3.5 active:bg-slate-50 transition-colors border-b border-slate-100">
      <div class="w-8 h-8 bg-blue-50 rounded-full flex items-center justify-center flex-none">
        <svg class="w-4 h-4 text-[#1a2b4a]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
      </div>
      <span class="flex-1 text-left text-sm font-medium text-slate-700">My Interests</span>
      <svg class="w-4 h-4 text-slate-300 flex-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>

    <button (click)="goToContributions()" class="w-full flex items-center gap-3 px-4 py-3.5 active:bg-slate-50 transition-colors">
      <div class="w-8 h-8 bg-blue-50 rounded-full flex items-center justify-center flex-none">
        <svg class="w-4 h-4 text-[#1a2b4a]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </div>
      <span class="flex-1 text-left text-sm font-medium text-slate-700">My Contributions</span>
      <svg class="w-4 h-4 text-slate-300 flex-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>

  </div>
</div>

  <!-- My Favorites -->
  <div class="px-5 mt-6">
    <div class="flex items-center justify-between mb-3">
      <p class="text-base font-bold text-slate-800">My Favorites</p>
      <button (click)="seeAllFavorites()" class="text-sm font-semibold text-[#e8722a]">See all</button>
    </div>

    <div class="flex gap-3 overflow-x-auto pb-2 favorites-scroll">
      <div *ngFor="let place of favorites"
        class="flex-none w-48 bg-white rounded-2xl shadow-sm overflow-hidden">
        <div class="relative h-32 bg-slate-200">
          <div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-slate-300 to-slate-400">
            <svg class="w-10 h-10 text-white/60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 16M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
          </div>
          <div class="absolute top-2 left-2 flex items-center gap-1 bg-black/50 rounded-full px-2 py-0.5">
            <svg class="w-3 h-3 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
              <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
            </svg>
            <span class="text-[10px] text-white font-semibold">{{ place.rating }}</span>
          </div>
          <button class="absolute top-2 right-2 w-7 h-7 bg-white rounded-full flex items-center justify-center shadow-sm">
            <svg class="w-4 h-4 text-[#e8722a]" fill="currentColor" viewBox="0 0 24 24">
              <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
          </button>
        </div>
        <div class="px-3 py-2.5">
          <p class="text-sm font-semibold text-slate-800 truncate">{{ place.name }}</p>
          <div class="flex items-center gap-1 mt-0.5">
            <svg class="w-3 h-3 text-slate-400 flex-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span class="text-xs text-slate-400 truncate">{{ place.country }}</span>
          </div>
        </div>
      </div>

      <div *ngIf="favorites.length === 0"
        class="flex-none w-full bg-white rounded-2xl shadow-sm px-5 py-8 flex flex-col items-center gap-2">
        <svg class="w-8 h-8 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
        <p class="text-sm text-slate-400 text-center">No favorites yet.</p>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-100 px-2 py-2 flex justify-around items-center">
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" stroke-width="1.5"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.24 7.76l-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/>
      </svg>
      <span class="text-[9px] font-medium">Explore</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      <span class="text-[9px] font-medium">Map</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="14" rx="2" stroke-width="1.5"/>
        <path stroke-linecap="round" stroke-width="1.5" d="M7 8h10M7 11.5h6"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 17l3 4"/>
      </svg>
      <span class="text-[9px] font-medium">Ask Agent</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-[#e8722a]">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
      <span class="text-[9px] font-medium">Profile</span>
    </button>
  </div>

</div>
