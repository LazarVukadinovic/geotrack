@if (isOpen()) {
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/40 z-60 transition-opacity"
       (click)="onCancel()"></div>

  <!-- Sheet -->
  <div 
    class="fixed bottom-0 left-0 right-0 z-70 bg-white rounded-t-[2rem] px-5 pt-2 shadow-2xl animate-slide-up"
    style="padding-bottom: max(2.5rem, env(safe-area-inset-bottom))"
    (touchstart)="onTouchStart($event)"
    (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd()"
    [style.transform]="dragOffset() > 0 ? 'translateY(' + dragOffset() + 'px)' : null"
    [style.transition]="isDragging() ? 'none' : 'transform 0.28s cubic-bezier(0.32,0.72,0,1)'"
  >
    <!-- Handle -->
    <div class="w-9 h-1 bg-slate-300 rounded-full mx-auto mt-3 mb-6 cursor-grab"></div>

    <!-- Icon -->
    <div class="w-11 h-11 bg-orange-50 rounded-full flex items-center justify-center mb-4">
      <svg class="w-5 h-5 text-[#e8722a]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
      </svg>
    </div>

    <h2 class="text-xl font-bold text-slate-800 mb-1">New Collection</h2>
    <p class="text-sm text-slate-500 mb-5">Give your collection a name to get started.</p>

    <!-- Input -->
    <label class="ml-1 text-[12px] font-bold tracking-[0.15em] text-slate-500 uppercase mb-2 block">
      Collection Name
    </label>
    <div class="bg-slate-50 border border-slate-300 rounded-2xl flex items-center gap-3 px-4 py-3.5 mb-6"
         [class.border-[#e8722a]]="name().length > 0"
         [class.bg-orange-50]="name().length > 0">
      <svg class="w-4 h-4 text-slate-500 flex-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18M3 12h12M3 17h8"/>
      </svg>
      <input
        #nameInput
        type="text"
        [value]="name()"
        (input)="onInput($event)"
        (keyup.enter)="onSave()"
        placeholder="e.g. Weekend Getaways…"
        maxlength="50"
        class="flex-1 bg-transparent text-sm text-slate-700 placeholder-slate-400 outline-none"/>
      @if (name().length > 0) {
        <button type="button" (click)="clearName()"
          class="w-5 h-5 rounded-full bg-slate-300 flex items-center justify-center flex-none">
          <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      }
    </div>

    <!-- Save -->
    <button type="button" (click)="onSave()"
      [disabled]="name().trim().length === 0"
      class="w-full py-4 bg-[#e8722a] rounded-3xl text-white font-bold text-base tracking-wide
             transition-all duration-200 mb-3 disabled:opacity-45 active:scale-[0.98]">
      Create Collection
    </button>

    <!-- Cancel -->
    <button type="button" (click)="onCancel()"
      class="w-full py-3 text-base font-bold text-[#1a2b4a] text-center active:opacity-60 transition-opacity">
      Cancel
    </button>
  </div>
}
