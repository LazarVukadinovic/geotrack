<div class="relative h-screen w-full overflow-hidden">

  <!-- ── BACKGROUND MAP ── -->
  <div id="bg-map" class="absolute inset-0 w-full h-full"></div>

  <!-- Gradient overlay — darker at bottom for nav readability -->
  <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-black/10 to-black/70 z-10"></div>

  <!-- ── TOP LOGO ── -->
  <div class="absolute top-6 left-6 z-20">
    <img src="images/logo.png" alt="Logo" class="w-16 h-16 object-contain drop-shadow-lg" />
  </div>

  <!-- ── CENTERED CONTENT ── -->
  <div class="absolute inset-0 z-20 flex flex-col items-center justify-center -translate-y-10 px-6 gap-5">

    <!-- Headline -->
    <div class="text-center">
      <p class="text-white/60 text-xs font-semibold tracking-[0.25em] uppercase mb-3">Discover the world</p>
      <h1 class="text-white text-[2.2rem] font-bold leading-tight tracking-tight drop-shadow-lg">
        Find Your Next<br/>Adventure
      </h1>
    </div>

    <!-- Search bar -->
    <div class="w-full max-w-sm mt-2">
      <div class="relative">
        <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
          </svg>
        </div>
        <input
          #searchInput
          type="text"
          placeholder="Where do you want to go?"
          [(ngModel)]="searchQuery"
          (input)="onSearch($any($event.target).value)"
          (keydown.escape)="clearSearch()"
          class="w-full pl-10 pr-4 py-4 bg-white rounded-2xl text-sm text-slate-800 placeholder-slate-400 outline-none shadow-2xl focus:ring-2 focus:ring-[#e8722a] transition-all duration-200"
        />
      </div>

      <!-- Search results dropdown -->
      <div *ngIf="searchResults.length > 0"
        class="mt-2 bg-white rounded-2xl shadow-2xl overflow-hidden">
        <ul>
          <li
            *ngFor="let result of searchResults"
            (click)="selectResult(result)"
            class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 active:bg-slate-100 cursor-pointer border-b border-slate-50 last:border-0 transition-colors duration-150">
            <div class="flex-none w-7 h-7 bg-orange-50 rounded-full flex items-center justify-center">
              <svg class="w-3.5 h-3.5 text-[#e8722a]" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5z"/>
              </svg>
            </div>
            <div class="min-w-0">
              <p class="text-sm font-semibold text-slate-800 truncate">{{ getResultName(result) }}</p>
              <p class="text-xs text-slate-400 truncate">{{ getResultSubtitle(result) }}</p>
            </div>
          </li>
        </ul>
      </div>
    </div>

    <!-- Use my location -->
    <button (click)="requestLocation()"
      class="flex items-center gap-1 text-white text-sm font-semibold hover:text-white transition-colors">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06z"/>
      </svg>
      Use my current location
    </button>

    <!-- Location permission dialog -->
    <div *ngIf="showLocationDialog"
      class="fixed inset-0 z-50 flex items-center justify-center px-6"
      style="background: rgba(0,0,0,0.5);">
      <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
        <div class="w-12 h-12 bg-orange-50 rounded-full flex items-center justify-center mb-4 mx-auto">
          <svg class="w-6 h-6 text-[#e8722a]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06z"/>
          </svg>
        </div>
        <h3 class="text-lg font-bold text-slate-800 text-center mb-2">Use Your Location</h3>
        <p class="text-sm text-slate-400 text-center mb-6 leading-relaxed">
          We'll show you what's around you on the map. Your location stays on your device.
        </p>
        <div class="flex gap-3">
          <button (click)="showLocationDialog = false"
            class="flex-1 py-3 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-600">
            Not now
          </button>
          <button (click)="confirmLocation()"
            class="flex-1 py-3 bg-[#e8722a] rounded-2xl text-sm font-bold text-white">
            Allow
          </button>
        </div>
      </div>
    </div>

    <!-- Explore hint -->
    <!-- <div class="flex flex-col items-center gap-1 mt-2">
      <svg class="w-5 h-5 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 9l-7 7-7-7"/>
      </svg>
    </div> -->
  </div>

  <!-- ── BOTTOM NAV ── -->
  <div class="absolute bottom-0 left-0 right-0 z-20 bg-white/95 backdrop-blur-sm border-t border-slate-100 px-2 py-2 flex justify-around items-center">

    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" stroke-width="1.5"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M16.24 7.76l-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/>
      </svg>
      <span class="text-[9px] font-bold">Explore</span>
    </button>

    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400" (click)="router.navigate(['/map'])">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      <span class="text-[9px] font-medium">Map</span>
    </button>

    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="14" rx="2" stroke-width="1.5"/>
        <path stroke-linecap="round" stroke-width="1.5" d="M7 8h10M7 11.5h6"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 17l3 4"/>
      </svg>
      <span class="text-[9px] font-medium">Ask Agent</span>
    </button>

    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400" (click)="router.navigate(['/login'])">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
      <span class="text-[9px] font-medium">Profile</span>
    </button>

  </div>

</div>
