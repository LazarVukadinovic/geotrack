<div class="min-h-screen flex flex-col bg-[#fafaf9]">

  <!-- Top ombre -->
  <div style="background: linear-gradient(to bottom, #2d4a7a 0%, #5b7fa6 40%, #a8c4d8 70%, #fafaf9 100%);"
    class="px-6 pt-10 pb-10">

    <!-- Step indicator -->
    <div class="pt-6 flex items-center justify-between mb-6">
      <button (click)="goBack()" class="w-8 h-8 flex items-center justify-center text-white/80">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <span class="text-xs font-semibold tracking-[0.15em] text-white/80">STEP 2 OF 2</span>
      <div class="w-8"></div>
    </div>
    <div class="h-1.5 bg-white/20 rounded-full overflow-hidden mb-10">
      <div class="h-full w-full bg-white rounded-full"></div>
    </div>

    <h1 class="text-2xl font-bold text-[#0f172a] tracking-tight mb-1.5">Choose your interests</h1>
    <p class="text-base text-slate-700 leading-relaxed">
      Selecting interests helps personalize your recommendations and tailor your experience.
    </p>
  </div>

  <!-- Content -->
  <div class="flex-1 px-6 pt-5 pb-28 flex flex-col bg-[#fafaf9]">

    <!-- Topics label + selected count -->
    <div class="flex items-center justify-between mb-5">
      <span class="ml-2 text-[12px] font-bold tracking-[0.15em] text-slate-700 uppercase">Suggested Topics</span>
      <span class="text-[12px] font-bold text-slate-600">
        {{ selectedInterests.length }} selected
      </span>
    </div>

    <!-- Interest chips -->
    <div class="flex flex-wrap justify-center gap-3 mt-6 mb-10 max-w-md mx-auto">
      <button
        *ngFor="let interest of interests"
        (click)="toggleInterest(interest)"
        class="flex items-center gap-1.5 px-4 py-2.5 rounded-full border text-sm font-medium transition-colors duration-200"
        [class.bg-[#1a2b4a]]="isSelected(interest)"
        [class.border-[#1a2b4a]]="isSelected(interest)"
        [class.text-white]="isSelected(interest)"
        [class.bg-white]="!isSelected(interest)"
        [class.border-slate-200]="!isSelected(interest)"
        [class.text-slate-600]="!isSelected(interest)">
        {{ interest }}
        <svg class="w-3.5 h-3.5 flex-none transition-opacity duration-200"
          [class.opacity-100]="isSelected(interest)"
          [class.opacity-0]="!isSelected(interest)"
          fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
        </svg>
      </button>
    </div>

    <div class="flex-1"></div>

    <!-- Finish button -->
    <button
      (click)="onFinish()"
      [disabled]="selectedInterests.length === 0"
      class="w-full py-3.5 rounded-3xl text-white font-bold text-base tracking-wide flex items-center justify-center gap-3 transition-all duration-200 active:scale-[0.98]"
      [class.bg-[#e8722a]]="selectedInterests.length > 0"
      [class.hover:bg-[#d4621f]]="selectedInterests.length > 0"
      [class.bg-slate-200]="selectedInterests.length === 0">
      Finish & Go to App
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
      </svg>
    </button>

    <button (click)="onSkip()" class="text-center text-base text-slate-500 font-medium mt-4">
      Skip for now
    </button>

    <p class="text-center text-sm text-slate-400 mt-3 leading-relaxed">
      Don't worry, our AI will continually learn what<br/>you like based on your activity over time.
    </p>
  </div>

  <!-- Bottom nav -->
  <div class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-100 px-2 py-2 flex justify-around items-center">
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" stroke-width="1.5"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M16.24 7.76l-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/>
      </svg>
      <span class="text-[9px] font-medium">Explore</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      <span class="text-[9px] font-medium">Map</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="14" rx="2" stroke-width="1.5"/>
        <path stroke-linecap="round" stroke-width="1.5" d="M7 8h10M7 11.5h6"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 17l3 4"/>
      </svg>
      <span class="text-[9px] font-medium">Ask Agent</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-[#e8722a]">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
      <span class="text-[9px] font-medium">Profile</span>
    </button>
  </div>

</div>
