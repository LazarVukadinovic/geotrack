<div class="min-h-screen bg-[#f8f7f4] flex flex-col">

  <!-- Status bar -->
  <div class="h-12 flex items-center px-5">
    <span class="text-slate-400 text-xs font-medium tracking-wide">9:41</span>
  </div>

  <!-- Header -->
  <div class="px-6 pb-4 flex-none">
    <div class="flex items-center justify-between mb-4">
      <button (click)="goBack()" class="w-8 h-8 flex items-center justify-center text-slate-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <span class="text-xs font-semibold tracking-[0.15em] text-slate-400">STEP 2 OF 2</span>
      <div class="w-8"></div>
    </div>
    <!-- Progress bar -->
    <div class="h-1 bg-slate-200 rounded-full overflow-hidden">
      <div class="h-full w-full bg-[#f97316] rounded-full"></div>
    </div>
  </div>

  <!-- Content -->
  <div class="flex-1 px-6 pt-4 pb-6 flex flex-col">

    <h1 class="text-2xl font-bold text-[#0f172a] tracking-tight mb-2">Choose your interests</h1>
    <p class="text-sm text-slate-400 mb-6 leading-relaxed">
      Selecting interests helps personalize your recommendations and tailor your experience.
    </p>

    <!-- Topics label + counter -->
    <div class="flex items-center justify-between mb-3">
      <span class="text-[10px] font-semibold tracking-[0.15em] text-slate-400 uppercase">Suggested Topics</span>
      <span class="text-xs font-semibold text-slate-400">
        {{ maxSelections - selectedInterests.length }} left
      </span>
    </div>

    <!-- Interest chips -->
    <div class="flex flex-wrap gap-2 mb-8">
      <button
        *ngFor="let interest of interests"
        (click)="toggleInterest(interest)"
        class="flex items-center gap-1.5 px-4 py-2.5 rounded-full border text-sm font-medium transition-all duration-200 active:scale-95"
        [class.bg-[#0f172a]]="isSelected(interest)"
        [class.border-[#0f172a]]="isSelected(interest)"
        [class.text-white]="isSelected(interest)"
        [class.bg-white]="!isSelected(interest)"
        [class.border-slate-200]="!isSelected(interest)"
        [class.text-slate-600]="!isSelected(interest)">
        {{ interest }}
        <svg *ngIf="isSelected(interest)" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
        </svg>
      </button>
    </div>

    <div class="flex-1"></div>

    <!-- Finish button -->
    <button
      (click)="onFinish()"
      [disabled]="selectedInterests.length === 0"
      class="w-full py-4 rounded-2xl text-white font-semibold text-sm tracking-wide flex items-center justify-center gap-2 shadow-lg transition-all duration-200 active:scale-[0.98]"
      [class.bg-[#f97316]]="selectedInterests.length > 0"
      [class.shadow-orange-200]="selectedInterests.length > 0"
      [class.bg-slate-200]="selectedInterests.length === 0"
      [class.shadow-none]="selectedInterests.length === 0">
      Finish & Go to App
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
      </svg>
    </button>

    <button (click)="onSkip()" class="text-center text-sm text-slate-400 font-medium mt-4">
      Skip for now
    </button>

    <p class="text-center text-[11px] text-slate-300 mt-3 leading-relaxed">
      Don't worry, our AI will continually learn what<br/>you like based on your activity over time.
    </p>
  </div>

  <!-- Bottom nav -->
  <div class="bg-[#f8f7f4] border-t border-slate-100 px-2 py-2 flex justify-around items-center">
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      <span class="text-[9px] font-medium">Explore</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      <span class="text-[9px] font-medium">Map</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
      </svg>
      <span class="text-[9px] font-medium">Ask Agent</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-[#f97316]">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
      <span class="text-[9px] font-medium">Profile</span>
    </button>
  </div>

</div>
