<div class="min-h-screen bg-white flex flex-col">

  <!-- Status bar -->
  <div class="h-12 flex items-center px-5 bg-gradient-to-b from-[#1e3a5f] to-transparent absolute top-0 left-0 right-0 z-10">
    <span class="text-white/60 text-xs font-medium tracking-wide">9:41</span>
  </div>

  <!-- Top gradient background -->
  <div class="h-48 bg-gradient-to-b from-[#1e3a5f] via-[#2d5a8e] to-[#e8f4fd] relative flex-none">
    <!-- Step indicator -->
    <div class="absolute bottom-0 left-0 right-0 px-6 pb-4">
      <div class="flex items-center justify-between mb-2">
        <button (click)="goBack()" class="w-8 h-8 flex items-center justify-center text-[#1e3a5f]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <span class="text-xs font-semibold tracking-[0.15em] text-[#1e3a5f]">STEP 1 OF 2</span>
        <div class="w-8"></div>
      </div>
      <!-- Progress bar -->
      <div class="h-1 bg-white/30 rounded-full overflow-hidden">
        <div class="h-full w-1/2 bg-[#f97316] rounded-full"></div>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="flex-1 bg-white px-6 pt-8 pb-8 flex flex-col -mt-1">

    <h1 class="text-2xl font-bold text-[#0f172a] tracking-tight mb-2">Create your account</h1>
    <p class="text-sm text-slate-400 mb-7 leading-relaxed">
      Join our premium guide to unlock personalized recommendations and itineraries.
    </p>

    <!-- Email -->
    <div class="mb-4">
      <label class="text-xs font-semibold text-slate-500 mb-2 block">Email Address</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
          <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <input
          type="email"
          [(ngModel)]="email"
          placeholder="name@example.com"
          class="w-full pl-10 pr-4 py-3.5 bg-white border border-slate-200 rounded-2xl text-sm text-slate-700 placeholder-slate-300 outline-none focus:border-[#f97316] focus:ring-2 focus:ring-orange-100 transition-all duration-200"
        />
      </div>
    </div>

    <!-- Password -->
    <div class="mb-4">
      <label class="text-xs font-semibold text-slate-500 mb-2 block">Create Password</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
          <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="Enter your password"
          (ngModelChange)="checkPasswordRequirements()"
          class="w-full pl-10 pr-12 py-3.5 bg-white border border-slate-200 rounded-2xl text-sm text-slate-700 placeholder-slate-300 outline-none focus:border-[#f97316] focus:ring-2 focus:ring-orange-100 transition-all duration-200"
        />
        <button
          (click)="showPassword = !showPassword"
          class="absolute inset-y-0 right-4 flex items-center text-slate-300 hover:text-slate-500 transition-colors">
          <svg *ngIf="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
          <svg *ngIf="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
          </svg>
        </button>
      </div>

      <!-- Password requirements -->
      <div class="mt-3 space-y-1.5">
        <p class="text-xs font-medium text-slate-500 mb-2">Password requirements:</p>
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 rounded-full border-2 flex items-center justify-center flex-none transition-colors duration-200"
            [class.border-[#f97316]]="req.minLength"
            [class.bg-[#f97316]]="req.minLength"
            [class.border-slate-300]="!req.minLength">
            <svg *ngIf="req.minLength" class="w-2.5 h-2.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
          <span class="text-xs" [class.text-slate-400]="!req.minLength" [class.text-[#f97316]]="req.minLength">
            At least 8 characters long
          </span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 rounded-full border-2 flex items-center justify-center flex-none transition-colors duration-200"
            [class.border-[#f97316]]="req.hasNumber"
            [class.bg-[#f97316]]="req.hasNumber"
            [class.border-slate-300]="!req.hasNumber">
            <svg *ngIf="req.hasNumber" class="w-2.5 h-2.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
          <span class="text-xs" [class.text-slate-400]="!req.hasNumber" [class.text-[#f97316]]="req.hasNumber">
            Contains a number
          </span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 rounded-full border-2 flex items-center justify-center flex-none transition-colors duration-200"
            [class.border-[#f97316]]="req.hasSpecial"
            [class.bg-[#f97316]]="req.hasSpecial"
            [class.border-slate-300]="!req.hasSpecial">
            <svg *ngIf="req.hasSpecial" class="w-2.5 h-2.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
          <span class="text-xs" [class.text-slate-400]="!req.hasSpecial" [class.text-[#f97316]]="req.hasSpecial">
            Contains a special character
          </span>
        </div>
      </div>
    </div>

    <!-- Repeat Password -->
    <div class="mb-7">
      <label class="text-xs font-semibold text-slate-500 mb-2 block">Repeat Password</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
          <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <input
          [type]="showRepeatPassword ? 'text' : 'password'"
          [(ngModel)]="repeatPassword"
          placeholder="Repeat your password"
          class="w-full pl-10 pr-12 py-3.5 bg-white border border-slate-200 rounded-2xl text-sm text-slate-700 placeholder-slate-300 outline-none focus:border-[#f97316] focus:ring-2 focus:ring-orange-100 transition-all duration-200"
          [class.border-red-300]="repeatPassword && password !== repeatPassword"
          [class.focus:border-red-400]="repeatPassword && password !== repeatPassword"
        />
        <button
          (click)="showRepeatPassword = !showRepeatPassword"
          class="absolute inset-y-0 right-4 flex items-center text-slate-300 hover:text-slate-500 transition-colors">
          <svg *ngIf="!showRepeatPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
          <svg *ngIf="showRepeatPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Continue button -->
    <button
      (click)="onContinue()"
      class="w-full py-4 bg-[#f97316] hover:bg-[#ea580c] active:scale-[0.98] rounded-2xl text-white font-semibold text-sm tracking-wide flex items-center justify-center gap-2 shadow-lg shadow-orange-200 transition-all duration-200">
      Continue
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
      </svg>
    </button>

    <p class="text-center text-[11px] text-slate-300 mt-4">
      By continuing you agree to our
      <button class="text-slate-400 underline">Terms</button>
      &
      <button class="text-slate-400 underline">Privacy Policy</button>
    </p>

    <div class="flex-1"></div>

    <p class="text-center text-sm text-slate-400 mt-6">
      Already have an account?
      <button (click)="goToLogin()" class="font-semibold text-[#f97316] ml-1">Sign in</button>
    </p>
  </div>

  <!-- Bottom nav -->
  <div class="bg-white border-t border-slate-100 px-2 py-2 flex justify-around items-center">
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      <span class="text-[9px] font-medium">Explore</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      <span class="text-[9px] font-medium">Map</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
      </svg>
      <span class="text-[9px] font-medium">Ask Agent</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 px-3 py-1 text-[#f97316]">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
      <span class="text-[9px] font-medium">Profile</span>
    </button>
  </div>

</div>
