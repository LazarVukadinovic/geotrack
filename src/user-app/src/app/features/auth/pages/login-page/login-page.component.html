<div class="min-h-full bg-white flex flex-col">

  <!-- Top dark header -->
  <div class="bg-[#1a2b4a] flex flex-col items-center justify-center pt-6 pb-14 rounded-b-[2.5rem]">
    <img src="images/logo.png" alt="Logo" class="w-28 h-28 object-contain" />
  </div>

  <!-- Off-white card overlapping header -->
  <div class="mx-4 -mt-14 bg-[#fafaf9] rounded-[2rem] px-7 pt-8 pb-10 flex flex-col gap-2 shadow-sm">

    <!-- Centered heading -->
    <div class="text-center mb-6">
      <h1 class="text-[1.7rem] font-bold text-[#0f172a] tracking-tight mb-2">Welcome back</h1>
      <p class="text-base text-slate-500 leading-relaxed">
        Please enter your details to sign in to<br/>your account.
      </p>
    </div>

    <!-- Email -->
    <div class="mb-4">
      <label class="ml-2 text-[12px] font-bold tracking-[0.15em] text-slate-700 uppercase mb-2 block">
        Email Address
      </label>
      <div class="relative">
        <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
          <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <input
          type="email"
          [(ngModel)]="email"
          placeholder="name@example.com"
          class="w-full pl-10 pr-4 py-4 bg-white border border-slate-200 rounded-3xl text-base text-slate-700 placeholder-slate-300 outline-none focus:border-[#e8570a] focus:ring-2 focus:ring-orange-100 transition-all duration-200"
        />
      </div>
    </div>

    <!-- Password -->
    <div class="mb-4">
      <label class="ml-2 text-[12px] font-bold tracking-[0.15em] text-slate-700 uppercase mb-2 block">
        Password
      </label>
      <div class="relative">
        <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
          <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="new-password"
          class="w-full pl-10 pr-12 py-4 bg-white border border-slate-200 rounded-3xl text-base text-slate-700 placeholder-slate-300 outline-none focus:border-[#e8570a] focus:ring-2 focus:ring-orange-100 transition-all duration-200"
        />
        @if (password.length > 0) {
          <button
            (click)="showPassword = !showPassword"
            type="button"
            class="absolute inset-y-0 right-4 flex items-center text-slate-300 hover:text-slate-500 transition-colors">
            @if (!showPassword) {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            }
            @if (showPassword) {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            }
          </button>
        }
      </div>
    </div>

    <!-- Remember me + Forgot -->
    <div class="flex items-center justify-between mb-5">
      <label class="flex items-center gap-2.5 cursor-pointer">
        <button
          (click)="rememberMe = !rememberMe"
          type="button"
          class="relative w-10 h-6 rounded-full transition-colors duration-300 focus:outline-none"
          [class.bg-[#e8570a]]="rememberMe"
          [class.bg-slate-200]="!rememberMe">
          <span
            class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow-sm transition-transform duration-300"
            [class.translate-x-4]="rememberMe">
          </span>
        </button>
        <span class="text-base text-slate-500">Remember me</span>
      </label>
      <button type="button" class="text-base font-bold text-[#e8570a]">Forgot password?</button>
    </div>

    <!-- Sign in button -->
    <button
      type="button"
      (click)="onSignIn()"
      class="w-full py-3.5 bg-[#e8570a] hover:bg-[#d4621f] active:scale-[0.98] rounded-3xl text-white font-bold text-base tracking-wide flex items-center justify-center gap-2 transition-all duration-200">
      Sign In
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
      </svg>
    </button>
  </div>

  <!-- Create account -->
  <p class="text-center text-base text-slate-400 mt-6 mb-4">
    Don't have an account?
    <button type="button" (click)="goToRegister()" class="font-bold text-[#e8570a] ml-1">Create one</button>
  </p>

</div>
